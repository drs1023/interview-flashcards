<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋招英语面试练习 · Flashcards · 中英对照</title>
<style>
  :root {
    --bg: #f5f3ff; --card: #ffffff; --accent: #7c3aed; --accent-dark: #5b21b6;
    --accent-light: #ede9fe; --text: #1f2937; --text-light: #6b7280; --text-faint: #9ca3af;
    --border: #e5e7eb; --star-s: #dc2626; --star-t: #ea580c; --star-a: #059669;
    --star-r: #2563eb; --star-refl: #7c3aed; --tag-bg: #f3f4f6;
    --cn-bg: #f8fafc; --cn-border: #e2e8f0; --cn-text: #475569;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.75; min-height:100vh; }
  .app { display:flex; min-height:100vh; }
  .sidebar { width:260px; flex-shrink:0; background:#fff; border-right:1px solid var(--border); padding:20px 0; overflow-y:auto; position:sticky; top:0; height:100vh; }
  .sidebar-header { padding:0 20px 16px; border-bottom:1px solid var(--border); margin-bottom:12px; }
  .sidebar-header h1 { font-size:16px; font-weight:700; color:var(--accent-dark); }
  .sidebar-header p { font-size:12px; color:var(--text-light); margin-top:4px; }
  .module-nav { list-style:none; padding:0; }
  .module-nav li { padding:10px 20px; cursor:pointer; font-size:13px; color:var(--text-light); border-left:3px solid transparent; transition:all .15s; display:flex; justify-content:space-between; align-items:center; }
  .module-nav li:hover { background:var(--accent-light); color:var(--accent); }
  .module-nav li.active { background:var(--accent-light); color:var(--accent); border-left-color:var(--accent); font-weight:600; }
  .module-nav li .count { font-size:11px; background:var(--tag-bg); padding:1px 7px; border-radius:10px; }
  .module-nav li.active .count { background:var(--accent); color:#fff; }
  .main { flex:1; padding:32px; max-width:920px; margin:0 auto; width:100%; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .toolbar-left { display:flex; align-items:center; gap:12px; }
  .progress-text { font-size:13px; color:var(--text-light); }
  .progress-bar { width:120px; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--accent); transition:width .3s; border-radius:3px; }
  .toolbar-right { display:flex; gap:8px; }
  .btn { padding:6px 14px; border:none; border-radius:8px; font-size:13px; cursor:pointer; font-weight:500; transition:all .15s; }
  .btn-shuffle { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .btn-shuffle:hover { background:var(--accent-light); }
  .btn-shuffle.active { background:var(--accent); color:#fff; }
  .card-container { perspective:1500px; margin-bottom:24px; }
  .card { background:var(--card); border-radius:20px; box-shadow:0 4px 24px rgba(124,58,237,.1); min-height:420px; position:relative; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.4,0,.2,1); cursor:pointer; }
  .card.flipped { transform:rotateY(180deg); }
  .card-face { position:absolute; top:0; left:0; width:100%; height:100%; backface-visibility:hidden; border-radius:20px; padding:32px; display:flex; flex-direction:column; }
  .card-back { transform:rotateY(180deg); overflow-y:auto; }
  .card-front .card-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .badge { font-size:11px; padding:3px 10px; border-radius:6px; font-weight:600; }
  .badge-module { background:var(--accent-light); color:var(--accent); }
  .badge-star { background:#fef3c7; color:#92400e; }
  .badge-priority { background:#fee2e2; color:#dc2626; }
  .badge-ai { background:#dbeafe; color:#2563eb; }
  .card-front .question-en { font-size:21px; font-weight:700; margin-bottom:6px; line-height:1.5; }
  .card-front .question-cn { font-size:14px; color:var(--text-light); margin-bottom:20px; }
  .card-front .story-hint { background:#fffbeb; border-left:3px solid #f59e0b; padding:12px 16px; border-radius:0 8px 8px 0; font-size:13px; color:#92400e; margin-top:auto; }
  .card-front .story-hint .label { font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:4px; }
  .card-front .flip-hint { text-align:center; margin-top:14px; font-size:12px; color:var(--text-faint); }
  .card-back .answer-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding-bottom:10px; border-bottom:2px solid var(--accent-light); }
  .card-back .answer-title { font-size:14px; font-weight:600; color:var(--accent); }
  .card-back .answer-body { font-size:13.5px; line-height:1.8; }
  .card-back .answer-body p { margin-bottom:10px; }
  .star-section { padding:6px 0; margin-bottom:6px; }
  .star-label { font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.5px; display:inline-block; padding:2px 8px; border-radius:4px; margin-right:6px; }
  .star-s .star-label { background:#fee2e2; color:var(--star-s); }
  .star-t .star-label { background:#ffedd5; color:var(--star-t); }
  .star-a .star-label { background:#d1fae5; color:var(--star-a); }
  .star-r .star-label { background:#dbeafe; color:var(--star-r); }
  .star-refl .star-label { background:var(--accent-light); color:var(--star-refl); }
  .cn-translation { background:var(--cn-bg); border:1px solid var(--cn-border); border-radius:10px; padding:14px 16px; margin-top:14px; font-size:13px; line-height:1.8; color:var(--cn-text); }
  .cn-translation .cn-label { font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:8px; }
  .cn-translation .star-section { padding:4px 0; }
  .source-tag { font-size:11px; color:var(--text-faint); margin-top:14px; padding-top:10px; border-top:1px dashed var(--border); }
  .card-back .flip-hint { text-align:center; margin-top:12px; font-size:12px; color:var(--text-faint); }
  .nav-buttons { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .nav-btn { padding:10px 24px; border:1px solid var(--border); background:#fff; border-radius:10px; font-size:14px; cursor:pointer; font-weight:500; color:var(--text); transition:all .15s; }
  .nav-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-light); }
  .nav-btn:disabled { opacity:.4; cursor:not-allowed; }
  .nav-btn:disabled:hover { border-color:var(--border); color:var(--text); background:#fff; }
  .keyboard-hint { text-align:center; font-size:12px; color:var(--text-faint); margin-top:8px; }
  .keyboard-hint kbd { background:#fff; border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-size:11px; margin:0 2px; }
  @media (max-width:768px) {
    .app { flex-direction:column; }
    .sidebar { width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--border); padding:12px 0; }
    .module-nav { display:flex; overflow-x:auto; padding:0 12px; }
    .module-nav li { white-space:nowrap; border-left:none; border-bottom:3px solid transparent; padding:8px 12px; }
    .module-nav li.active { border-left:none; border-bottom-color:var(--accent); }
    .main { padding:20px 16px; }
    .card-face { padding:24px 20px; }
    .card-front .question-en { font-size:18px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🎯 秋招英语面试练习</h1>
      <p>杜晓月专属 · 中英对照 · STAR 法则</p>
    </div>
    <ul class="module-nav" id="moduleNav">
      <li class="active" data-module="all">全部题目 <span class="count" id="countAll">0</span></li>
      <li data-module="1">1. 自我介绍 <span class="count" id="count1">0</span></li>
      <li data-module="2">2. 行为面试 STAR <span class="count" id="count2">0</span></li>
      <li data-module="3">3. HR 专业场景 <span class="count" id="count3">0</span></li>
      <li data-module="4">4. 大厂文化价值观 <span class="count" id="count4">0</span></li>
      <li data-module="5">5. 情景模拟 <span class="count" id="count5">0</span></li>
      <li data-module="6">6. 收尾与反问 <span class="count" id="count6">0</span></li>
    </ul>
  </aside>
  <div class="main">
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="progress-text" id="progressText">1 / 0</span>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-shuffle" id="shuffleBtn" onclick="toggleShuffle()">🔀 随机抽题</button>
      </div>
    </div>
    <div class="card-container">
      <div class="card" id="card" onclick="flipCard()">
        <div class="card-face card-front" id="cardFront"></div>
        <div class="card-face card-back" id="cardBack"></div>
      </div>
    </div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" onclick="prevCard()">← 上一题</button>
      <button class="nav-btn" id="nextBtn" onclick="nextCard()">下一题 →</button>
    </div>
    <div class="keyboard-hint"><kbd>←</kbd> 上一题 · <kbd>→</kbd> 下一题 · <kbd>Space</kbd> 翻卡</div>
  </div>
</div>
<script>
const QUESTIONS = [
  // ===== M1: Self-Introduction =====
  {
    module:1, moduleLabel:"自我介绍", subGroup:"破冰", priority:"high",
    q:"Tell me about yourself.",
    cn:"请做自我介绍。",
    hint:"Present-Past-Future 结构，90秒。强调四段经历的递进逻辑 + AI×HR 差异化 + 数据能力（大数据双学位）。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body">
      <p>I'm Xiaoyue Du, currently pursuing my master's in Business Administration at Northeastern University, with a bachelor's degree in Business Administration and Big Data — so I bring both HR domain knowledge and quantitative skills to the table.</p>
      <p>Right now, I'm interning as an AI × HR specialist at Tencent CSIG, focusing on OD and workforce planning. My projects include building an intern development management platform — about 4,000 lines of code integrating Tencent Docs API and WeCom bots — developing a competitive intelligence platform that scraped 1,394 job postings from 5 competitor companies, and designing the automation plan for a talent evaluation workbench where I identified 6 data gaps in the existing workflow.</p>
      <p>Before this, I did recruitment at ByteDance's Feishu team, focusing on AI developer roles. I handled the full-cycle recruitment for large model development, data security, and backend positions — processing 100+ resumes daily with a 90% self-sourced rate and 15% interview conversion rate.</p>
      <p>I also spent a year as a teaching volunteer in Altay, Xinjiang, where I led a 26-member teaching team as team captain, covering 527 students across 4 grades. That experience taught me adaptability and leadership in resource-constrained environments.</p>
      <p>I started my HR journey as an HRBP intern at BGI Genomics, where I closed 15+ positions with an 87% completion rate and led campus recruitment compensation negotiations.</p>
      <p>Looking forward, I'm passionate about the intersection of AI and HR — I believe the next generation of HR leaders need to be as comfortable with code and data as they are with people.</p>
    </div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>我是杜晓月，目前在东北大学攻读工商管理硕士学位，本科是工商管理+大数据双学位——所以我同时具备 HR 领域知识和量化分析能力。</p>
      <p>现在在腾讯 CSIG 做 AI×HR 专项实习生，方向是 OD 和人力规划。我的项目包括：独立开发实习生培养管理平台（约4000行代码，接入了腾讯文档 Open API 和企微机器人）、开发竞对情报管理平台（抓取了5家竞对公司1394条在招岗位）、设计人才评估工作台自动化方案（识别出6处数据断层）。</p>
      <p>之前在字节跳动飞书团队做招聘实习，负责大模型开发、数据安全、通用后端等研发岗位的全流程招聘，日均处理简历100+份，自主寻访占比90%，约面转化率15%。</p>
      <p>我还去新疆阿勒泰支教了一年，作为第26届研究生支教团团长，带领团队覆盖4个年级527名学生，周均课时20节。这段经历教会了我在资源受限环境下的适应力和领导力。</p>
      <p>我的 HR 之旅始于华大基因 HRBP 实习，期间完成15+关键岗位入职，招聘完成率87%，并主导了校招薪酬谈判。</p>
      <p>未来，我对 AI×HR 的交叉领域充满热情——我相信下一代 HR 领导者需要像懂人一样懂代码和数据。</p>
    </div>
    <div class="source-tag">信息源：Simplilearn HR 面试指南 · Present-Past-Future 结构 · 简历数据</div>
    <div class="flip-hint">点击卡片返回题目 ↑</div>`
  },
  {
    module:1, moduleLabel:"自我介绍", subGroup:"破冰", priority:"high",
    q:"Walk me through your resume.",
    cn:"请过一遍你的简历。",
    hint:"按时间线讲，每段经历提炼一个关键词。不要流水账。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body">
      <p>Sure. Four chapters:</p>
      <p><b>Chapter 1 — Foundation:</b> At Northeastern University, I studied Business Administration with a Big Data minor — GPA 3.74, top 15%. I was deeply involved in student leadership, serving as executive president of both the graduate and undergraduate student councils. During my year teaching in Altay as a China Western Program volunteer, I led a 26-person teaching team, covered 527 students, and won a national bronze award for volunteer service.</p>
      <p><b>Chapter 2 — HRBP grounding:</b> At BGI Genomics, I did full-spectrum HRBP work — closed 15+ positions at 87% completion rate, led campus recruitment compensation negotiations, and built data dashboards on HR metrics like turnover and cost rates.</p>
      <p><b>Chapter 3 — Recruitment at scale:</b> At ByteDance's Feishu team, I handled AI developer recruitment — 100+ resumes/day, 90% self-sourced, 15% interview conversion. I also created recruitment enablement docs that improved new hire ramp-up by 40%.</p>
      <p><b>Chapter 4 — Strategic HR + AI:</b> Now at Tencent CSIG, I've moved into OD and workforce planning. I've built a full-stack intern management platform, a competitive intelligence tool, and a token governance framework. This is where my passion for AI × HR comes alive.</p>
    </div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>好的，四个篇章：</p>
      <p><b>第一章——基础：</b>在东北大学读工商管理+大数据，GPA 3.74，专业前15%。深度参与学生工作，担任过研究生会和学生会执行主席。在阿勒泰支教一年，作为支教团团长带领26人团队覆盖527名学生，获全国志愿服务大赛铜奖。</p>
      <p><b>第二章——HRBP 打底：</b>在华大基因做 HRBP 全模块实习，完成15+岗位入职（87%完成率），主导校招薪酬谈判，搭建人事数据看板。</p>
      <p><b>第三章——规模化招聘：</b>在字节飞书做 AI 开发方向招聘，日均处理100+简历，自主寻访90%，约面转化15%。输出的招聘赋能文档让新人上手效率提升40%。</p>
      <p><b>第四章——战略 HR + AI：</b>现在腾讯 CSIG 做 OD 和人力规划，独立开发了实习生管理平台、竞对情报平台、token 管理框架。这是我 AI×HR 热情真正爆发的地方。</p>
    </div>
    <div class="source-tag">信息源：Amazon "Walk me through your resume" 结构 · 简历数据</div>
    <div class="flip-hint">点击卡片返回题目 ↑</div>`
  },
  {
    module:1, moduleLabel:"自我介绍", subGroup:"破冰", priority:"high",
    q:"What made you interested in HR?",
    cn:"为什么对 HR 感兴趣？",
    hint:"从支教切入——意识到「理解人、设计让人发挥的系统」才是最有力的事。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body">
      <p>My interest in HR started during my year teaching in Altay, Xinjiang. I was teaching math and English to 527 students across 4 grades, and I realized that the most impactful thing I could do wasn't just delivering content — it was understanding what motivated each student, figuring out why some thrived while others struggled, and designing an environment where everyone could perform. I led a 26-person teaching team, and that experience taught me that 'people systems' — the structures that help people do their best work — are what I'm passionate about.</p>
      <p>When I returned, I saw HR as the professional version of that same instinct. My HRBP internship at BGI Genomics confirmed it — I loved being at the intersection of business strategy and people. At ByteDance, recruitment taught me speed and data-driven decision-making. And now at Tencent, I'm exploring the frontier of AI in HR, which I believe is the most exciting space in the field.</p>
    </div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>我对 HR 的兴趣始于阿勒泰支教。我当时教4个年级527名学生的数学和英语，意识到最有影响力的事不是传授知识——而是理解每个人的动力，找出为什么有人出色有人挣扎，设计一个让每个人都能发挥的环境。我带领26人的支教团，这段经历让我意识到「人的系统」——帮助人做到最好的结构——才是我的热情所在。</p>
      <p>回来后，我把 HR 看作这个直觉的职业版本。华大基因 HRBP 实习印证了这一点——我热爱站在业务战略和人的交叉点。字节招聘教会了我速度和数据驱动。现在腾讯让我探索 AI×HR 的前沿。</p>
    </div>
    <div class="source-tag">信息源：个人经历提炼 · UK Interview Guide</div>
    <div class="flip-hint">点击卡片返回题目 ↑</div>`
  },
  {
    module:1, moduleLabel:"自我介绍", subGroup:"破冰", priority:"medium",
    q:"Why are you interested in our company?",
    cn:"为什么选择我们公司？",
    hint:"模板——面试前针对具体公司填入业务亮点、HR团队定位、AI布局。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案（模板，需面试前定制）</span></div>
    <div class="answer-body">
      <p>Three reasons:</p>
      <p>First, <b>your business trajectory</b>. [填入：该公司近期业务亮点]. I'm drawn to companies that are growing fast — that's where HR has the most strategic impact.</p>
      <p>Second, <b>how your HR team operates</b>. [填入：HR 团队特点]. This aligns with the kind of environment where I can contribute and grow.</p>
      <p>Third, <b>your approach to AI</b>. [填入：该公司 AI 布局]. Having worked on AI token governance and AI-integrated HR tools at Tencent, I'm very interested in companies thinking seriously about how AI transforms work.</p>
    </div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>三个原因：</p>
      <p>第一，<b>业务发展势头</b>。[填入具体亮点]。我倾向于快速增长的公司——那里 HR 的战略价值最大。</p>
      <p>第二，<b>HR 团队运作方式</b>。[填入团队特点]。这与我能贡献和成长的环境匹配。</p>
      <p>第三，<b>AI 布局</b>。[填入 AI 策略]。在腾讯做过 AI token 治理和 AI 集成 HR 工具后，我非常关注认真思考 AI 如何变革工作的公司。</p>
    </div>
    <div class="source-tag">信息源：Amazon "Why Amazon" 范例 · UK Interview Guide</div>
    <div class="flip-hint">点击卡片返回题目 ↑</div>`
  },

  // ===== M2: Behavioral =====
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.1 团队协作与冲突", priority:"high", isSTAR:true,
    q:"Tell me about a time you worked with someone whose personality was very different from yours.",
    cn:"讲述一次与性格截然不同的人合作的经历。",
    hint:"字节飞书——与偏好异步沟通的开发同事合作，调整为结构化异步更新。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body">
      <div class="star-section star-s"><span class="star-label">Situation</span>At ByteDance's Feishu team, I was paired with a senior developer on AI-related roles. He was extremely introverted, preferred async communication, and would go hours without responding. I'm naturally more collaborative and verbal.</div>
      <div class="star-section star-t"><span class="star-label">Task</span>I needed to maintain a fast pipeline (100+ resumes/day) while respecting his working style.</div>
      <div class="star-section star-a"><span class="star-label">Action</span>I adapted. I switched from spontaneous messages to structured daily async updates — a brief summary of candidate status, what I needed, and a deadline. I batched questions instead of sending them one by one. When we needed to sync, I scheduled 15-minute focused calls with clear agendas. I also started pre-writing candidate summaries in a structured format he could scan quickly.</div>
      <div class="star-section star-r"><span class="star-label">Result</span>We successfully maintained a 15% interview conversion rate on these roles. The developer specifically thanked me for being 'easy to work with.' I learned that effective collaboration isn't about finding people who work like you — it's about flexing your style to create a shared rhythm.</div>

    q:"Describe a time you received feedback that was hard to hear. How did you respond?",
    cn:"描述一次你收到刺耳反馈的经历，你是怎么回应的？",
    hint:"MT 说绩效框架初稿太理论化——不够贴业务。用 STARR。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STARR</span></div>
    <div class="answer-body">
      <div class="star-section star-s"><span class="star-label">Situation</span>At Tencent, I spent significant effort creating a comprehensive performance evaluation framework. When I presented it to my mentor, she said: 'This is well-designed on paper, but no business leader will actually use it. It's too complex and disconnected from how they think about performance.'</div>
      <div class="star-section star-t"><span class="star-label">Task</span>My first instinct was to defend my work — but I knew if my mentor felt this way, business leaders would feel it more strongly.</div>
      <div class="star-section star-a"><span class="star-label">Action</span>I asked: 'Can you walk me through what a business leader would find confusing?' Instead of arguing, I listened. Then I interviewed two business leaders about how they think about performance — what language they use, what dimensions matter. I discovered they think in terms of 'did this person deliver?' and 'are they growing?', not multi-dimensional scoring matrices. I redesigned using their language, simplifying from 7 dimensions to 3, framing each in business terms.</div>
      <div class="star-section star-r"><span class="star-label">Result</span>The revised framework was adopted. My mentor said the difference was 'night and day' — from an HR document to a business tool. Business leaders felt ownership because their language was reflected.</div>
      <div class="star-section star-refl"><span class="star-label">Reflection</span>That feedback stung, but it was one of the most valuable moments of my internship. It taught me: in HR, 'well-designed' doesn't mean 'theoretically perfect' — it means 'usable by the people who need to use it.' I now build a 'would a business leader actually use this?' check into every framework I design.</div>
    </div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <div class="star-section star-s"><span class="star-label">情境</span>在腾讯花了很多精力做了一套全面的绩效评估框架。给 MT 看时，她说："纸面上设计得不错，但业务负责人不会真用。太复杂、不贴业务。"</div>
      <div class="star-section star-t"><span class="star-label">任务</span>第一反应是辩解——但我知道如果 MT 这么觉得，业务方会更强烈。</div>
      <div class="star-section star-a"><span class="star-label">行动</span>我问："能不能带我过一下业务负责人会觉得哪里看不懂？"不争辩，只听。然后访谈了两位业务负责人，了解他们怎么想绩效——用什么语言、哪些维度重要。发现他们想的是"这人交付了吗？""在成长吗？"——不是多维评分矩阵。我用他们的语言重做，从7个维度简化到3个，每个维度用业务语言表述。</div>
      <div class="star-section star-r"><span class="star-label">结果</span>修订版被采纳。MT 说差异是"天壤之别"——从 HR 文件变成了业务工具。业务方因为看到自己的语言而有了归属感。</div>
      <div class="star-section star-refl"><span class="star-label">反思</span>那次反馈很难受，但是最有价值的时刻之一。学到：在 HR 中"设计好"不是"理论上完美"——而是"需要用的人能用得上"。我现在每个框架都加一个"业务负责人真的会用吗？"的自检。</div>
    </div>
    <div class="source-tag">信息源：Mocky.pro STARR · CV Career Consultants</div>
    <div class="flip-hint">点击卡片返回题目 ↑</div>`

  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.7 变革管理", priority:"high", isSTAR:true,
    q:"Tell me about a change you brought about in your role.",
    cn:"讲述一次你在岗位上推动的变革。",
    hint:"AI token 管理——从无序使用到三级配额体系+操作手册。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body">
      <div class="star-section star-s"><span class="star-label">Situation</span>At Tencent, there was no AI token governance. People used AI tools freely, costs were unpredictable, and leadership was starting to question ROI. There was a real risk of blanket restriction.</div>
      <div class="star-section star-t"><span class="star-label">Task</span>I needed to introduce governance that controlled costs without stifling productive AI use.</div>
      <div class="star-section star-a"><span class="star-label">Action</span>I designed a three-tier allocation model: baseline budget for everyone (routine use), project pool (approved by team lead for specific deliverables), and on-demand flow (exceptional needs). I incorporated token costs into the department's resource pool allocation, assisted each business department with their platform-specific token planning, and created an operational manual documenting daily token-saving practices. I framed it as 'enabling sustainable AI use' rather than 'restricting access.'</div>
      <div class="star-section star-r"><span class="star-label">Result</span>Costs became predictable and within budget, while productive usage actually increased — people felt confident using their allocation and knew how to request more. The model and manual were shared as reference for other teams. Key learning: change management in HR isn't about imposing rules — it's about creating systems where the desired behavior is also the easiest behavior.</div>
    </div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <div class="star-section star-s"><span class="star-label">情境</span>在腾讯，AI token 没有治理。大家随意使用，成本不可预测，管理层开始质疑 ROI。有全面限制的风险。</div>
      <div class="star-section star-t"><span class="star-label">任务</span>需要引入既控成本又不压制 AI 使用的治理。</div>
      <div class="star-section star-a"><span class="star-label">行动</span>设计了三级分配模型：基础配额（日常用）、项目池（团队负责人审批）、按需申请（特殊需求）。把算力成本纳入部门资源池分配，协助各业务部门推进不同平台的 Token 规划，沉淀了日常节省 Token 的操作手册。定位为"让 AI 可持续使用"而非"限制使用"。</div>
      <div class="star-section star-r"><span class="star-label">结果</span>成本变得可预测且在预算内，但有效使用反而增加——人们对配额有信心、知道怎么申请更多。模型和手册被分享给其他团队做参考。关键学习：HR 的变革管理不是强加规则——而是创造让期望行为也成为最容易行为的系统。</div>
    </div>
    <div class="source-tag">信息源：简历：Token规划管理+操作手册文档 · Rotman 变更管理</div>
    <div class="flip-hint">点击卡片返回题目 ↑</div>`

  {

    q:"Describe a time you faced an ethical dilemma at work.",
    cn:"描述一次你在工作中面临的伦理困境。",
    hint:"发现招聘渠道偏向名校——系统性排除了有能力但非名校的候选人。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body">
      <div class="star-section star-s"><span class="star-label">Situation</span>During recruitment at ByteDance, I noticed our sourcing strategy heavily prioritized candidates from target universities. While efficient (higher pass rate, faster sourcing), it systematically excluded capable candidates from other schools.</div>
      <div class="star-section star-t"><span class="star-label">Task</span>The target-school approach worked by metrics, but felt ethically questionable. Should I raise it, knowing it might slow our process?</div>
      <div class="star-section star-a"><span class="star-label">Action</span>I raised it — but with data, not just principle. I pulled a sample of non-target-school hires who'd joined through other channels and compared their performance metrics. The data showed no significant performance difference. I presented this to my team lead and suggested expanding sourcing to 3 additional schools as a pilot. I framed it as 'we might be missing good candidates' rather than 'our process is unfair.'</div>
      <div class="star-section star-r"><span class="star-label">Result</span>The team lead agreed to a pilot. Pass-through rate was slightly lower (more screening needed), but candidates who passed performed equally well. The pilot opened the door to a more inclusive sourcing strategy. Lesson: ethical dilemmas are best addressed with data and small experiments, not grandstand arguments.</div>
    </div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <div class="star-section star-s"><span class="star-label">情境</span>在字节招聘中，我发现寻访策略严重偏向目标院校。虽然效率高（通过率高、寻访快），但系统性地排除了非名校但有能力的候选人。</div>
      <div class="star-section star-t"><span class="star-label">任务</span>目标院校策略在指标上是有效的，但在伦理上值得质疑。要提出来吗？知道可能拖慢流程。</div>
      <div class="star-section star-a"><span class="star-label">行动</span>用数据而非道义提出。拉了一组通过其他渠道入职的非目标校候选人的绩效数据做对比——数据显示无显著差异。向团队负责人建议扩展3所学校做试点。定位为"我们可能错过了好候选人"而非"我们不公平"。</div>
      <div class="star-section star-r"><span class="star-label">结果</span>负责人同意试点。通过率略低（需要更多筛选），但通过的候选人表现一样好。试点为更包容的寻访策略开了门。经验：伦理困境最好用数据和小实验回应，而非高调辩论。</div>
    </div>
    <div class="source-tag">信息源：CV Career Consultants 伦理题 · 简历：字节招聘经验</div>
    <div class="flip-hint">点击卡片返回题目 ↑</div>`

  {

    q:"Describe a complex recruitment challenge you faced and how you overcame it.",
    cn:"描述你遇到的一个复杂招聘挑战，以及如何克服的。",
    hint:"字节飞书——大模型开发岗，技术门槛高+候选人稀缺+需理解AI技术场景。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body">
      <div class="star-section star-s"><span class="star-label">Situation</span>At ByteDance's Feishu team, I was recruiting for large model development roles — a highly competitive market where the same candidates were being pursued by multiple companies. The technical bar was extremely high, and I needed to deeply understand AI development scenarios to assess candidate fit.</div>
      <div class="star-section star-t"><span class="star-label">Task</span>I needed to fill these roles with quality candidates while maintaining a high self-sourcing rate (I was at 90%) and improving conversion (stuck at 15%).</div>
      <div class="star-section star-a"><span class="star-label">Action</span>I took a 'become a domain expert' approach. I dove into the technical scenarios — large model development, compliance, data security — to understand the actual job requirements beyond the JD. I mapped out which tech stacks mattered for which sub-roles. I created structured candidate cards that flagged tech stack match, highlight, and risk — reducing hiring manager review time. I also built a recruitment enablement doc — 'The Big Model Recruitment Guide for HR' — covering business communication scripts, tech stack matching logic, and salary negotiation points. I shared this with the team.</div>
      <div class="star-section star-r"><span class="star-label">Result</span>The enablement doc improved new hire ramp-up efficiency by 40%. My conversion rate improved from 15% to ~20%. The team adopted my candidate card format and info talk framework as standard practice. The key learning: in technical recruitment, the differentiator isn't sourcing volume — it's domain depth. The more I understood the technology, the better I could match candidates and the more hiring managers trusted my recommendations.</div>
    </div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <div class="star-section star-s"><span class="star-label">情境</span>在字节飞书招大模型开发岗——市场竞争极激烈，技术门槛极高，需要深入理解 AI 开发场景才能评估匹配度。</div>
      <div class="star-section star-t"><span class="star-label">任务</span>需要保质保量填补岗位，同时维持90%自主寻访率、改善15%的约面转化。</div>
      <div class="star-section star-a"><span class="star-label">行动</span>采取"成为领域专家"策略。深入技术场景——大模型开发、合规、数据安全——理解 JD 之外的真实需求。梳理了哪些技术栈对应哪些细分岗位。创建结构化"候选人卡片"（技术栈匹配、亮点、风险标记），缩短用人方审核时间。还写了《面向HR的大模型招聘指南》——涵盖业务沟通话术、技术栈匹配逻辑、薪酬谈判要点——分享给团队。</div>
      <div class="star-section star-r"><span class="star-label">结果</span>赋能文档让新人效率提升40%。转化率从15%提升到约20%。团队把候选人卡片格式和 info talk 框架采纳为标准做法。关键学习：技术招聘的差异化不在寻访量——而在领域深度。越懂技术，越能匹配候选人，用人方越信任推荐。</div>
    </div>
    <div class="source-tag">信息源：简历：90%自主寻访/15%转化/新人效率提升40%/大模型招聘指南</div>

  {
    module:3, moduleLabel:"HR 专业场景", subGroup:"3.2 绩效与员工关系", priority:"high", isSTAR:true,
    q:"Tell me about a time you had to deal with a difficult employee situation or conflict.",
    cn:"讲述一次你处理困难员工关系或冲突的经历。",
    hint:"华大基因 HRBP——处理部门负责人和员工之间的公开批评螺旋。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body">
      <div class="star-section star-s"><span class="star-label">Situation</span>At BGI Genomics, a manager was giving negative feedback to an employee in public settings — team meetings, group chats. The employee became disengaged and started missing deadlines, which the manager cited as further evidence of poor performance. It was a downward spiral.</div>
      <div class="star-section star-t"><span class="star-label">Task</span>As HRBP, I needed to intervene — supporting the employee and coaching the manager — without taking sides.</div>
      <div class="star-section star-a"><span class="star-label">Action</span>I met with the employee first, privately, to listen and validate. I also helped them see that their performance decline was making things worse. Then I met with the manager — privately — using a coaching approach: 'How do you think your feedback is being received?' The manager hadn't realized public feedback was demoralizing, not motivating. I introduced a simple rule: corrective feedback is always private, positive feedback can be public. I also suggested bi-weekly 1:1s.</div>
      <div class="star-section star-r"><span class="star-label">Result</span>Within a month, the dynamic improved. The employee's performance recovered, and the manager started using private channels for corrective feedback. Both separately thanked me. Lesson: in employee relations, you rarely need to 'pick a side' — you need to help both parties see each other's perspective and give them better tools to interact.</div>
    </div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <div class="star-section star-s"><span class="star-label">情境</span>在华大基因，一个 manager 在公开场合（团队会、群聊）给员工负面反馈。员工变得消沉、开始错过截止日期，manager 又拿这个当绩效差的证据。恶性循环。</div>
      <div class="star-section star-t"><span class="star-label">任务</span>作为 HRBP，需要介入——支持员工+辅导 manager——不站队。</div>
      <div class="star-section star-a"><span class="star-label">行动</span>先私下见员工，倾听和确认感受，也帮 ta 看到绩效下滑在让情况更糟。然后私下见 manager，用辅导方式："你觉得你的反馈被怎么接收的？"manager 没意识到公开批评是打击而非激励。我引入一条简单规则：纠正性反馈永远私下，表扬可以公开。还建议双周1:1。</div>
      <div class="star-section star-r"><span class="star-label">结果</span>一个月内互动改善。员工绩效恢复，manager 开始用私下渠道给纠正反馈。两人分别感谢我。经验：员工关系中很少需要"站队"——需要的是帮双方看到对方视角，给更好的互动工具。</div>
    </div>
    <div class="source-tag">信息源：interviews.chat HR Specialist · 简历：华大基因 HRBP</div>
    <div class="flip-hint">点击卡片返回题目 ↑</div>`

  {
    module:3, moduleLabel:"HR 专业场景", subGroup:"3.3 人力规划与组织发展", priority:"medium",
    q:"How do you approach workforce planning for a rapidly growing team?",
    cn:"你如何为快速增长的团队做人力规划？",
    hint:"结合子公司人才转型经验+竞对情报分析+OD实操。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body">
      <p>I approach it in four phases, informed by my current OD work at Tencent:</p>
      <p><b>1. Understand business trajectory:</b> Partner with business leaders to map growth targets, new capabilities needed, and timeline. The plan must be driven by business needs, not HR assumptions.</p>
      <p><b>2. Assess current capability + competitive landscape:</b> I inventory existing skills, performance, and potential. I also bring competitive intelligence — my platform that scraped 1,394 competitor job postings gives us real-time visibility into what competitors are hiring for, which signals where the market is heading.</p>
      <p><b>3. Build the gap plan:</b> Fill gaps through hiring, upskilling, and restructuring. I prioritize internal solutions before external hiring. In my current work on subsidiary talent transformation, this means identifying which team members can transition to AI-augmented roles versus which need upskilling.</p>
      <p><b>4. Create flexibility:</b> Build scenarios (base, stretch, conservative) rather than a single forecast. Build pipeline before need — I've done this by maintaining warm candidate relationships even before reqs are approved.</p>
      <p>The biggest lesson from my current role: workforce planning in the AI era isn't just about headcount — it's about capability transformation. Sometimes the question isn't 'do we need more people?' but 'do our current people need to become different people?'</p>
    </div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>分四步，基于我在腾讯的 OD 实操：</p>
      <p><b>1. 理解业务轨迹：</b>和业务负责人一起梳理增长目标、新能力需求、时间线。计划必须由业务驱动，不是 HR 假设。</p>
      <p><b>2. 盘点现有能力+竞对格局：</b>盘点现有技能、绩效、潜力。还带入竞对情报——我开发的抓取1394条竞对岗位的平台让我们实时看到竞对在招什么，信号市场走向。</p>
      <p><b>3. 制定缺口方案：</b>通过招聘、培训、重构填缺口。优先内部方案再外部招聘。在子公司人才转型工作中，这意味着识别谁能转向 AI 增强角色、谁需要培训。</p>
      <p><b>4. 创造灵活性：</b>做多场景（基础/挑战/保守）而非单一预测。在需求来之前就建管线——我通过在 req 批准前就维护候选人关系来做到这点。</p>
      <p>当前角色最大的教训：AI 时代的人力规划不只是编制——是能力转型。有时问题不是"需要更多人吗？"而是"我们的人需要变成不同的人吗？"</p>
    </div>
    <div class="source-tag">信息源：简历：竞对情报1394条+子公司人才转型+OD方向</div>
    <div class="flip-hint">点击卡片返回题目 ↑</div>`

  {

    q:"Tell me about a time you implemented a new technology in an HR context.",

    hint:"⭐差异化亮点——Vibe coding 平台+Token 管理框架。",
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR · ⭐ 差异化亮点</span></div>
    <div class="answer-body">
      <div class="star-section star-s"><span class="star-label">Situation</span>At Tencent, our team had no systematic way to track intern development, and AI tools were being used without governance — costs were unpredictable, and leadership was considering restricting access.</div>
      <div class="star-section star-t"><span class="star-label">Task</span>I needed to solve two problems: build an HR tool that actually worked for the team, and create a governance framework for AI usage.</div>
      <div class="star-section star-a"><span class="star-label">Action</span>I tackled both. For the tool, I independently designed and built an intern development management platform using Vibe coding — about 4,000 lines covering daily logs, 1on1 records, milestones, and training plans. I integrated Tencent Docs Open API for log syncing and built a WeCom bot with AES encryption + WebSocket for automated message pushing and meeting todo extraction. For governance, I designed a three-tier token allocation model and incorporated costs into the department resource pool. I created an operational manual for daily token-saving practices.</div>
      <div class="star-section star-r"><span class="star-label">Result</span>The platform was deployed and adopted by the team. The token governance model made costs predictable while productive AI usage increased. Both were presented as reference practices. Key learning: technology in HR isn't about tools — it's about building systems where technology amplifies human judgment rather than replacing it.</div>
    </div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <div class="star-section star-s"><span class="star-label">情境</span>在腾讯，团队没有系统追踪实习生培养的方式，AI 工具也无治理——成本不可预测，管理层考虑限制使用。</div>

      <p><b>3. 执行中：优先尊严。</b>面对面谈，不发邮件。manager 有谈话要点。离职补偿、再就业支持、推荐信在谈话前就准备好。诚实说明业务原因。</p>

      <p>我的理念，受当前工作影响：如果一个岗位挂不到真实业务绩效上，留着比裁掉更糟——对个人和组织都是。</p>
    </div>

// ====== APP LOGIC ======
let currentModule='all', currentIdx=0, isShuffled=false, shuffleOrder=[], isFlipped=false;
function getFilteredQuestions(){ if(currentModule==='all') return QUESTIONS; return QUESTIONS.filter(q=>q.module===parseInt(currentModule)); }
function getDisplayList(){ if(isShuffled) return shuffleOrder.map(i=>QUESTIONS[i]); return getFilteredQuestions(); }
function buildShuffleOrder(){ const f=getFilteredQuestions(); const idx=f.map(q=>QUESTIONS.indexOf(q)); for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];} shuffleOrder=idx; }
function renderCard(){
  const list=getDisplayList();
  if(list.length===0){document.getElementById('cardFront').innerHTML='<p style="text-align:center;color:#999;padding:40px;">暂无题目</p>';document.getElementById('cardBack').innerHTML='';return;}
  if(currentIdx>=list.length) currentIdx=list.length-1;
  if(currentIdx<0) currentIdx=0;
  const q=list[currentIdx]; isFlipped=false;
  document.getElementById('card').classList.remove('flipped');
  let badges=`<span class="badge badge-module">${q.moduleLabel}</span>`;
  if(q.isSTAR) badges+=`<span class="badge badge-star">STAR</span>`;
  if(q.priority==='high') badges+=`<span class="badge badge-priority">高频</span>`;
  if(q.isAI) badges+=`<span class="badge badge-ai">AI×HR</span>`;
  document.getElementById('cardFront').innerHTML=`<div class="card-meta">${badges}</div><div class="question-en">${q.q}</div><div class="question-cn">${q.cn}</div><div class="story-hint"><span class="label">素材提示</span>${q.hint}</div><div class="flip-hint">点击卡片查看参考答案 ↓</div>`;
  document.getElementById('cardBack').innerHTML=q.answer;
  document.getElementById('progressText').textContent=`${currentIdx+1} / ${list.length}`;
  document.getElementById('progressFill').style.width=`${((currentIdx+1)/list.length)*100}%`;
  document.getElementById('prevBtn').disabled=currentIdx===0;
  document.getElementById('nextBtn').disabled=currentIdx===list.length-1;
}
function flipCard(){ isFlipped=!isFlipped; document.getElementById('card').classList.toggle('flipped'); }
function nextCard(){ const list=getDisplayList(); if(currentIdx<list.length-1){currentIdx++;renderCard();} }
function prevCard(){ if(currentIdx>0){currentIdx--;renderCard();} }
function setModule(mod){ currentModule=mod; currentIdx=0; if(isShuffled) buildShuffleOrder(); document.querySelectorAll('.module-nav li').forEach(li=>li.classList.toggle('active',li.dataset.module===mod)); renderCard(); }
function toggleShuffle(){ isShuffled=!isShuffled; document.getElementById('shuffleBtn').classList.toggle('active'); currentIdx=0; if(isShuffled) buildShuffleOrder(); renderCard(); }
function updateCounts(){ document.getElementById('countAll').textContent=QUESTIONS.length; for(let m=1;m<=6;m++){const c=QUESTIONS.filter(q=>q.module===m).length;const el=document.getElementById('count'+m);if(el)el.textContent=c;} }
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prevCard();else if(e.key==='ArrowRight')nextCard();else if(e.key===' '){e.preventDefault();flipCard();}});
document.querySelectorAll('.module-nav li').forEach(li=>li.addEventListener('click',()=>setModule(li.dataset.module)));
updateCounts(); renderCard();
</script>
