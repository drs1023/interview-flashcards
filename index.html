<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋招英语面试练习 · Flashcards · 中英对照</title>
<style>
  :root {
    --bg: #f5f3ff; --card: #ffffff; --accent: #7c3aed; --accent-dark: #5b21b6;
    --accent-light: #ede9fe; --text: #1f2937; --text-light: #6b7280; --text-faint: #9ca3af;
    --border: #e5e7eb; --star-s: #dc2626; --star-t: #ea580c; --star-a: #059669;
    --star-r: #2563eb; --star-refl: #7c3aed; --tag-bg: #f3f4f6;
    --cn-bg: #f8fafc; --cn-border: #e2e8f0; --cn-text: #475569;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.75; min-height:100vh; }
  .app { display:flex; min-height:100vh; }
  .sidebar { width:260px; flex-shrink:0; background:#fff; border-right:1px solid var(--border); padding:20px 0; overflow-y:auto; position:sticky; top:0; height:100vh; }
  .sidebar-header { padding:0 20px 16px; border-bottom:1px solid var(--border); margin-bottom:12px; }
  .sidebar-header h1 { font-size:16px; font-weight:700; color:var(--accent-dark); }
  .sidebar-header p { font-size:12px; color:var(--text-light); margin-top:4px; }
  .module-nav { list-style:none; padding:0; }
  .module-nav li { padding:10px 20px; cursor:pointer; font-size:13px; color:var(--text-light); border-left:3px solid transparent; transition:all .15s; display:flex; justify-content:space-between; align-items:center; }
  .module-nav li:hover { background:var(--accent-light); color:var(--accent); }
  .module-nav li.active { background:var(--accent-light); color:var(--accent); border-left-color:var(--accent); font-weight:600; }
  .module-nav li .count { font-size:11px; background:var(--tag-bg); padding:1px 7px; border-radius:10px; }
  .module-nav li.active .count { background:var(--accent); color:#fff; }
  .main { flex:1; padding:32px; max-width:920px; margin:0 auto; width:100%; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .toolbar-left { display:flex; align-items:center; gap:12px; }
  .progress-text { font-size:13px; color:var(--text-light); }
  .progress-bar { width:120px; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--accent); transition:width .3s; border-radius:3px; }
  .toolbar-right { display:flex; gap:8px; }
  .btn { padding:6px 14px; border:none; border-radius:8px; font-size:13px; cursor:pointer; font-weight:500; transition:all .15s; }
  .btn-shuffle { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .btn-shuffle:hover { background:var(--accent-light); }
  .btn-shuffle.active { background:var(--accent); color:#fff; }
  .card-container { perspective:1500px; margin-bottom:24px; }
  .card { background:var(--card); border-radius:20px; box-shadow:0 4px 24px rgba(124,58,237,.1); min-height:420px; position:relative; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.4,0,.2,1); cursor:pointer; }
  .card.flipped { transform:rotateY(180deg); }
  .card-face { position:absolute; top:0; left:0; width:100%; height:100%; backface-visibility:hidden; border-radius:20px; padding:32px; display:flex; flex-direction:column; }
  .card-back { transform:rotateY(180deg); overflow-y:auto; }
  .card-front .card-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .badge { font-size:11px; padding:3px 10px; border-radius:6px; font-weight:600; }
  .badge-module { background:var(--accent-light); color:var(--accent); }
  .badge-star { background:#fef3c7; color:#92400e; }
  .badge-priority { background:#fee2e2; color:#dc2626; }
  .badge-ai { background:#dbeafe; color:#2563eb; }
  .card-front .question-en { font-size:21px; font-weight:700; margin-bottom:6px; line-height:1.5; }
  .card-front .question-cn { font-size:14px; color:var(--text-light); margin-bottom:20px; }
  .card-front .story-hint { background:#fffbeb; border-left:3px solid #f59e0b; padding:12px 16px; border-radius:0 8px 8px 0; font-size:13px; color:#92400e; margin-top:auto; }
  .card-front .story-hint .label { font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:4px; }
  .card-front .flip-hint { text-align:center; margin-top:14px; font-size:12px; color:var(--text-faint); }
  .card-back .answer-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding-bottom:10px; border-bottom:2px solid var(--accent-light); }
  .card-back .answer-title { font-size:14px; font-weight:600; color:var(--accent); }
  .card-back .answer-body { font-size:13.5px; line-height:1.8; }
  .card-back .answer-body p { margin-bottom:10px; }
  .star-section { padding:6px 0; margin-bottom:6px; }
  .star-label { font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.5px; display:inline-block; padding:2px 8px; border-radius:4px; margin-right:6px; }
  .star-s .star-label { background:#fee2e2; color:var(--star-s); }
  .star-t .star-label { background:#ffedd5; color:var(--star-t); }
  .star-a .star-label { background:#d1fae5; color:var(--star-a); }
  .star-r .star-label { background:#dbeafe; color:var(--star-r); }
  .star-refl .star-label { background:var(--accent-light); color:var(--star-refl); }
  .cn-translation { background:var(--cn-bg); border:1px solid var(--cn-border); border-radius:10px; padding:14px 16px; margin-top:14px; font-size:13px; line-height:1.8; color:var(--cn-text); }
  .cn-translation .cn-label { font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:8px; }
  .cn-translation .star-section { padding:4px 0; }
  .source-tag { font-size:11px; color:var(--text-faint); margin-top:14px; padding-top:10px; border-top:1px dashed var(--border); }
  .card-back .flip-hint { text-align:center; margin-top:12px; font-size:12px; color:var(--text-faint); }
  .followup-section { background:#f5f3ff; border:1px solid #ddd6fe; border-radius:10px; padding:14px 16px; margin-top:14px; }
  .followup-header { font-size:11px; font-weight:700; color:#7c3aed; text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:10px; }
  .followup-item { padding:9px 0; border-top:1px dashed #e9e5f7; }
  .followup-item:first-of-type { border-top:none; padding-top:2px; }
  .followup-q { font-size:13px; font-weight:600; color:#4c1d95; margin-bottom:3px; }
  .followup-q::before { content:"↳ "; color:#a78bfa; }
  .followup-a { font-size:13px; line-height:1.7; color:var(--text); }
  .followup-cn { font-size:12px; line-height:1.6; color:var(--cn-text); margin-top:2px; }
  .speak-btn { display:inline-flex; align-items:center; gap:5px; margin-left:8px; padding:3px 10px; border:1px solid var(--accent); background:var(--accent-light); color:var(--accent); border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; transition:all .15s; vertical-align:middle; }
  .speak-btn:hover { background:var(--accent); color:#fff; }
  .speak-btn.speaking { background:var(--accent); color:#fff; }
  .answer-header .speak-btn { margin-left:auto; }
  .followup-item .speak-btn { float:right; margin-left:6px; margin-top:-2px; }
  .tts-hint { font-size:11px; color:var(--text-faint); margin-top:6px; }
  .nav-buttons { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .nav-btn { padding:10px 24px; border:1px solid var(--border); background:#fff; border-radius:10px; font-size:14px; cursor:pointer; font-weight:500; color:var(--text); transition:all .15s; }
  .nav-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-light); }
  .nav-btn:disabled { opacity:.4; cursor:not-allowed; }
  .nav-btn:disabled:hover { border-color:var(--border); color:var(--text); background:#fff; }
  .keyboard-hint { text-align:center; font-size:12px; color:var(--text-faint); margin-top:8px; }
  .keyboard-hint kbd { background:#fff; border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-size:11px; margin:0 2px; }
  @media (max-width:768px) {
    .app { flex-direction:column; }
    .sidebar { width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--border); padding:12px 0; }
    .module-nav { display:flex; overflow-x:auto; padding:0 12px; }
    .module-nav li { white-space:nowrap; border-left:none; border-bottom:3px solid transparent; padding:8px 12px; }
    .module-nav li.active { border-left:none; border-bottom-color:var(--accent); }
    .main { padding:20px 16px; }
    .card-face { padding:24px 20px; }
    .card-front .question-en { font-size:18px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🎯 秋招英语面试练习</h1>
      <p>杜晓月专属 · 中英对照 · STAR 法则</p>
    </div>
    <ul class="module-nav" id="moduleNav">
      <li class="active" data-module="all">全部题目 <span class="count" id="countAll">0</span></li>
      <li data-module="1">1. 自我介绍 <span class="count" id="count1">0</span></li>
      <li data-module="2">2. 行为面试 STAR <span class="count" id="count2">0</span></li>
      <li data-module="3">3. HR 专业场景 <span class="count" id="count3">0</span></li>
      <li data-module="4">4. 大厂文化价值观 <span class="count" id="count4">0</span></li>
      <li data-module="5">5. 情景模拟 <span class="count" id="count5">0</span></li>
      <li data-module="6">6. 收尾与反问 <span class="count" id="count6">0</span></li>
      <li data-module="7">7. 个人生活 <span class="count" id="count7">0</span></li>
      <li data-module="8">8. 支教生活 <span class="count" id="count8">0</span></li>
  <li data-module="9">9. 字节国际电商HRBP <span class="count" id="count9">0</span></li>
    </ul>
  </aside>
  <div class="main">
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="progress-text" id="progressText">1 / 0</span>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-shuffle" id="shuffleBtn" onclick="toggleShuffle()">🔀 随机抽题</button>
      </div>
    </div>
    <div class="card-container">
      <div class="card" id="card" onclick="flipCard()">
        <div class="card-face card-front" id="cardFront"></div>
        <div class="card-face card-back" id="cardBack"></div>
      </div>
    </div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" onclick="prevCard()">← 上一题</button>
      <button class="nav-btn" id="nextBtn" onclick="nextCard()">下一题 →</button>
    </div>
    <div class="keyboard-hint"><kbd>←</kbd> 上一题 · <kbd>→</kbd> 下一题 · <kbd>Space</kbd> 翻卡</div>
  </div>
</div>
<script>
const QUESTIONS = [
  // ===== M1: Self-Introduction =====
  {
    module:1, moduleLabel:"自我介绍", subGroup:"破冰", priority:"high",
    q:"Tell me about yourself.",
    cn:"请做自我介绍。",
    hint:"Present-Past-Future 结构，90秒。忠实原话：本硕东北大学工商管理 + 多段HR实习（HRBP/招聘/人才发展/评估）+ 学生工作 + 深耕HR。",
    followups:[{q:"Which part of HRBP work excites you most?", a:"Being the person a business leader trusts with their people problems. Recruiting is fun, but the real pull is sitting close to the business.", cn:"成为业务 leader 在人的问题上信赖的人。招聘好玩，但真正吸引我的是贴近业务。"}, {q:"What did the student roles teach you that internships didn't?", a:"How to actually move a team — running something with people, not just for myself. You learn to push others, not only yourself.", cn:"怎么真正推动一个团队——和别人一起把事跑起来，不只是为自己。你会学到怎么推别人，而不只是推自己。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>Hi, I'm Du Xiaoyue. I did both my bachelor's and master's in Business Administration at Northeastern University. I've interned in HR across a few areas — HRBP, recruiting, talent development, and assessment. At school I also took on student leadership roles. I want to keep growing in HR, deeper rather than wider.</p></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>你好，我是杜晓月。本硕都读东北大学工商管理。我在 HR 几个方向实习过——HRBP、招聘、人才发展、评估。在校也承担学生工作。我希望在 HR 继续深耕，往深走而不是往宽走。</p></div>`
  },
  {
    module:1, moduleLabel:"自我介绍", subGroup:"破冰", priority:"high",
    q:"Walk me through your resume.",
    cn:"请过一遍你的简历。",
    hint:"按时间线讲，每段经历提炼一个关键词。不要流水账。",
    followups:[{q:"Which chapter was your favorite, and why?", a:"Chapter 2 — BGI. That's where I first sat with a business as their HRBP, not just an HR admin.", cn:"第二章——华大。那是我第一次作为 HRBP 陪业务坐下来，而不只是 HR 行政。"}, {q:"If I called your ByteDance manager, what would they say about you?", a:"Probably that I'm fast and a bit restless — I like to move, and I'd rather ask for forgiveness than permission.", cn:"大概会说我快、有点坐不住——我喜欢推进，宁可先斩后奏。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>Sure. Four quick parts.</p>
<p>One — school: Northeastern University, Business Administration, GPA 3.74, top 15%, plus a year teaching in Altay.</p>
<p>Two — HRBP at BGI: 15+ roles filled, 87% rate, built HR dashboards.</p>
<p>Three — recruiting at ByteDance: 100+ resumes a day, 90% sourced by me, conversion up to 20%.</p>
<p>Four — now at Tencent CSIG: OD and workforce planning, plus the tools I built.</p></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>好的，四块。</p>
<p>一、学校：东北大学工商管理，GPA 3.74，前 15%，加阿勒泰支教一年。</p>
<p>二、华大 HRBP：完成 15+ 岗位，完成率 87%，搭 HR 看板。</p>
<p>三、字节招聘：日均 100+ 简历，90% 自主寻访，转化提到 20%。</p>
<p>四、现腾讯 CSIG：OD 与人力规划，加我自己建的工具。</p></div>`
  },
  {
    module:1, moduleLabel:"自我介绍", subGroup:"破冰", priority:"high",
    q:"What made you interested in HR?",
    cn:"为什么对 HR 感兴趣？",
    hint:"从支教切入——意识到「理解人、设计让人发挥的系统」才是最有力的事。",
    followups:[{q:"But HR can be slow and political. Doesn't that bug you?", a:"Sometimes. But I see the politics as a system to design around — that's the puzzle I actually like.", cn:"偶尔会。但我把那些人情世故看作可以设计的系统——那正是我喜欢的谜题。"}, {q:"What if you'd never gone to Altay — would you still be in HR?", a:"Honestly, maybe not. That year is what turned 'people are interesting' into 'this is the work.'", cn:"说实话，可能不会。是那一年把'人对我很有趣'变成了'这就是我要做的工作'。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>It started in Altay. I taught 527 kids across four grades. I found the real value wasn't the lesson — it was understanding each kid and building a space where they could do their best.</p>
<p>Leading 26 volunteers showed me I care most about people systems. Back home, HR felt like the professional version of that. BGI's HRBP stint confirmed it: I love sitting where business meets people.</p></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>始于阿勒泰。我教 4 个年级 527 名学生，发现真正的价值不是讲课——而是理解每个孩子、搭一个让他们发挥的空间。</p>
<p>带 26 名志愿者让我确认自己最在乎人的系统。回来后 HR 像是那个直觉的职业版本。华大 HRBP 印证了：我爱坐在业务和人的交叉点。</p></div>`
  },
  {
    module:1, moduleLabel:"自我介绍", subGroup:"破冰", priority:"medium",
    q:"Why are you interested in our company?",
    cn:"为什么选择我们公司？",
    hint:"模板——面试前针对具体公司填入业务亮点、HR团队定位、AI布局。",
    followups:[{q:"What would you want to achieve in your first 90 days?", a:"First, listen to my business leaders. Then find one slow people-process and fix it — something small I can ship fast.", cn:"先听我的业务 leader。再找一个慢的流程修掉——挑个能快速交付的小事。"}, {q:"How do you know you'd fit our culture?", a:"I don't fully yet — that's why I'm asking you questions too. But I thrive in places where HR sits close to the business.", cn:"现在还不敢说——所以我也反问你。但我最适合 HR 贴近业务的环境。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>Two reasons.</p>
<p>First, I want an HRBP role that sits close to the business, not in a back office. I'm drawn to teams where HR helps shape real outcomes.</p>
<p>Second, I care about how AI changes HR — and I want to be somewhere actually doing it, not just talking. If the role lets me grow as a business partner, that's where I want to be.</p></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>两点。</p>
<p>一、我要的是贴近业务的 HRBP 岗，不在后台。我看好 HR 能参与真实结果的团队。</p>
<p>二、我在意 AI 怎么改变 HR——我想待在真在做、而非只谈的地方。如果这岗让我作为业务伙伴成长，那就是我想去的地方。</p></div>`
  },

  // ===== M2: Behavioral =====
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.1 团队协作与冲突", priority:"high", isSTAR:true,
    q:"Tell me about a time you worked with someone whose personality was very different from yours.",
    cn:"讲述一次与性格截然不同的人合作的经历。",
    hint:"字节飞书——与偏好异步沟通的开发同事合作，调整为结构化异步更新。",
    followups:[{q:"Have you ever had it fail — where adapting your style didn't work?", a:"Once. With someone who genuinely preferred zero sync. I learned sometimes the best adaptation is agreeing to stay out of each other's way.", cn:"有过一次。有人真心偏好零同步。我学到有时候最好的适应就是同意各自干活不互扰。"}, {q:"How do you figure out someone's style quickly?", a:"I watch their first few replies — async or real-time, short or detailed — and match that.", cn:"我观察前几条回复——异步还是实时、简短还是详细——然后匹配那个节奏。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At ByteDance's Feishu team I worked with a quiet senior dev on AI roles. He liked async chat; I'm more in-person.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I had to keep a fast pipeline — 100+ resumes a day — while respecting his style.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I sent a short daily update: where candidates stood, what I needed, by when. I batched questions instead of pinging him. For syncs I booked a tight 15-minute call.</div>
<div class="star-section star-r"><span class="star-label">Result</span>We kept a 15% interview rate. He thanked me for being easy to work with. I learned good teamwork is bending your style to find a shared rhythm.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>字节飞书团队，我和一位安静的资深开发合作招 AI 岗。他爱异步沟通，我更爱当面。</p>
<p><b>任务：</b>我得维持快节奏——日均 100+ 简历——同时尊重他的风格。</p>
<p><b>行动：</b>我发简短每日同步：候选人进度、我需要什么、何时。我攒问题而非不停 ping 他。同步会只约 15 分钟、议程清晰。</p>
<p><b>结果：</b>面试率保持 15%，他感谢我好合作。好团队协作是弯下自己的风格去找共同节奏。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.1 团队协作与冲突", priority:"high", isSTAR:true,
    q:"Describe a time you faced a conflict while working on a team. How did you handle it?",
    cn:"描述一次团队中的冲突，你是怎么处理的。",
    hint:"华大基因——两个部门负责人争夺编制名额，用数据化解情绪。",
    followups:[{q:"What if the data was ambiguous and both sides had a point?", a:"Then I'd frame it as 'both have a real case' and ask them to co-write the trade-off — the tension becomes shared.", cn:"那我就说'两边都有道理'，请他们一起写取舍——矛盾就变成共担的了。"}, {q:"Have you ever had to escalate a conflict you couldn't resolve?", a:"Yes. Once I brought both parties to a senior leader, but with my analysis and options, not just 'they disagree.'", cn:"有过。一次我��着分析和选项把双方带到上级面前，不是'他们合不来'——是'这是情况，这些是可选方向'。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At BGI Genomics, two department heads fought over headcount. Both felt short-staffed.</div>
<div class="star-section star-t"><span class="star-label">Task</span>As HRBP for both, I had to mediate fairly, with data, no sides.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I met each head alone to learn their workload, then pulled the numbers. At a joint meeting I showed the data and asked them to co-write the plan.</div>
<div class="star-section star-r"><span class="star-label">Result</span>They compromised: one more hire for the busier team, an intern for the other. Both felt heard. Data turned a fight into a shared fix.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>华大基因，两个部门负责人为编制吵架，都觉得自己缺人。</p>
<p><b>任务：</b>作为双方 HRBP，我要公平调解、用数据、不站队。</p>
<p><b>行动：</b>我分别单独见两位，了解工作量；再拉数据。联席会上展示数据，请他们一起写方案。</p>
<p><b>结果：</b>双方妥协：更忙的团队加一人，另一方加实习生。都觉得被听见。数据把争吵变成共同解法。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.1 团队协作与冲突", priority:"medium", isSTAR:true,
    q:"Give an example of when you supported a struggling team member.",
    cn:"举例说明你如何帮助困难的队友。",
    hint:"支教团——帮助一位教学困难的团员调整方法。",
    followups:[{q:"How do you tell the difference between someone struggling vs. someone who just isn't trying?", a:"I look for effort first — are they showing up, trying things, asking questions? If yes, it's a support problem. If no, it's a motivation conversation.", cn:"我先看有没有努力——他们在不在出现、试没试东西、问不问题？如果有，那是支持问题。如果没有，那是动力谈话。"}, {q:"What if your help didn't work?", a:"Then I'd ask them directly: 'What kind of support would actually help?' Sometimes I guess wrong.", cn:"那我就直接问：'什么样的支持对你有用？'有时候我猜的不对。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>In Altay I was team captain. One teammate struggled with classroom management. Kids tuned out; confidence dropped.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I wanted to help without making them feel judged.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I invited them to co-teach my class, not watch theirs. I showed a few engagement tricks, then asked what they noticed. I shared my own rough start. We tried two techniques and I checked in weekly.</div>
<div class="star-section star-r"><span class="star-label">Result</span>In three weeks their class was livelier. They shared their own tricks at meetings. The best help is showing a fix, not pointing at the problem.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>在阿勒泰我是队长。一位队友课堂管理吃力，孩子走神、信心下滑。</p>
<p><b>任务：</b>我想帮 ta，又不让 ta 觉得被评判。</p>
<p><b>行动：</b>我请 ta 来合上我的课，而不是只听 ta 的课。我示范几个互动小技巧，再问 ta 注意到了什么；也讲自己起步时的狼狈。我们试了两个方法，我每周跟进。</p>
<p><b>结果：</b>三周后 ta 的班活跃了，开始主动分享技巧。最好帮助是示范解法，而非指着问题。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.2 领导力与主动性", priority:"high", isSTAR:true,
    q:"Tell me about a time you demonstrated leadership without formal authority.",
    cn:"讲述一次没有正式职权但展现了领导力的经历。",
    hint:"腾讯人才评估工作台——没有被正式指派为负责人，但主动推动多方对齐。",
    followups:[{q:"How do you handle stakeholders who just won't align?", a:"I escalate the cost of not deciding — 'if we don't pick a direction by Friday, we lose X.' Inaction has a price too.", cn:"我放大不决策的代价——'如果周五前不定方向，我们会损失X。'不行动也有成本。"}, {q:"Was there pushback because you were an intern?", a:"A little at first. I countered by being the most prepared person in the room — data, visuals, clear options.", cn:"一开始有一点。我用'做房间里准备最充分的人'来回应——数据、可视化、清晰选项。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At Tencent I designed the plan for a talent-evaluation workbench. HRBPs, data, and IT wanted different things. No one was named lead.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I had to align everyone and push a direction — without being anyone's boss.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I interviewed every stakeholder and mapped the workflow in a one-page brief with the six gaps. I built a priority matrix, then ran a session where the group decided together.</div>
<div class="star-section star-r"><span class="star-label">Result</span>The project moved from stuck to clear. Business and tech agreed, and my mentor praised the clarity.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>在腾讯我负责人才评估工作台方案。HRBP、数据、IT 想要的不同，没人被指定为负责人。</p>
<p><b>任务：</b>我得对齐所有人、推动方向——但不是任何人的上司。</p>
<p><b>行动：</b>我访谈每个干系人，用一页简报画出流程和 6 个缺口；建了优先级矩阵，然后开会让小组一起定。</p>
<p><b>结果：</b>项目从卡住变清晰，业务和技术达成一致，导师夸清晰。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.2 领导力与主动性", priority:"high", isSTAR:true,
    q:"Describe a time you took initiative beyond your assigned responsibilities.",
    cn:"描述一次你主动超出职责范围做事的经历。",
    hint:"独立开发实习生培养管理平台——没被要求写代码，但主动用 Vibe coding 做了全栈产品。",
    followups:[{q:"How did you learn to code well enough to build a full-stack platform?", a:"I didn't — I used Vibe coding and learned by doing. The 4,000 lines were my crash course.", cn:"我不算会——我用Vibe coding边做边学。那4000行就是我的速成班。"}, {q:"What was the hardest technical challenge?", a:"The WeCom bot's AES encryption — I spent two days on that alone. Worth it when the messages started flowing.", cn:"企微机器人的AES加解密——光这个就花了两天。但消息开始推送的时候值了。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At Tencent there was no system to track intern growth. Logs, 1-on-1s, and plans were scattered.</div>
<div class="star-section star-t"><span class="star-label">Task</span>That wasn't my job — I was in OD — but I saw a gap I could fill.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I built an intern platform on my own with Vibe coding. It covers logs, 1-on-1s, milestones, training plans, plus a WeCom bot for push. About 4,000 lines.</div>
<div class="star-section star-r"><span class="star-label">Result</span>The team adopted it. My mentor saw proof I can build a fix end to end, and gave me more ownership.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>在腾讯没有系统跟踪实习生成长，日志、1-on-1、计划都散着。</p>
<p><b>任务：</b>那不是我的活——我做的是 OD——但我看到能补的缺口。</p>
<p><b>行动：</b>我一人用 Vibe coding 建了实习生平台，覆盖日志、1-on-1、里程碑、培训计划，加企微机器人推送，约 4000 行。</p>
<p><b>结果：</b>团队采用了。导师视其为我能端到端解决的证明，给了我更多 ownership。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.2 领导力与主动性", priority:"medium", isSTAR:true,
    q:"Tell me about a project you initiated that wasn't part of your core role.",
    cn:"讲述一个你主动发起的非核心职责项目。",
    hint:"竞对情报管理平台——Playwright抓取1394条岗位，输出结构化分析报告。",
    followups:[{q:"How did you choose which 5 competitors to analyze?", a:"I picked the ones our leadership mentioned most in meetings — Haojing, iSoftStone, ChinaSoft, and two others. Relevance over coverage.", cn:"我选了领导层会上最常提的几家——浩鲸、软通、中软、再加两家。相关度大于覆盖面。"}, {q:"Did anyone push back on the time you spent on this?", a:"No — I did it in my own time. I saw a gap and filled it. My mentor encouraged that.", cn:"没有——我用自己时间做的。看到缺口就填。MT 鼓励这样。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At Tencent our team had no real competitive intel on talent. We heard stories, but nothing structured.</div>
<div class="star-section star-t"><span class="star-label">Task</span>It wasn't in my job description, but I saw a chance to build something useful.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I built a competitive-intel platform. With Playwright I scraped 1,394 job posts from five rivals on BOSS Zhipin, then shaped them into role profiles and reports.</div>
<div class="star-section star-r"><span class="star-label">Result</span>Leadership saw competitor talent strategy clearly for the first time. The method cut future analyses from weeks to days. My mentor called it "building infrastructure, not just tasks."</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>在腾讯我们团队没有真正的竞对人才情报，只听故事、没有结构化信息。</p>
<p><b>任务：</b>不在我的岗位职责里，但我看到能建点有用的东西。</p>
<p><b>行动：</b>我建了竞对情报平台：用 Playwright 从 BOSS 直聘抓了 5 家对手的 1394 条岗位，整理成岗位画像和对比报告。</p>
<p><b>结果：</b>管理层第一次清楚看到对手人才策略；方法把后续分析从数周缩到数天。导师说这是"建基础设施，不是只做任务"。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.3 问题解决与决策", priority:"high", isSTAR:true,
    q:"Tell me about a time you solved a complex problem under pressure.",
    cn:"讲述一次在压力下解决复杂问题的经历。",
    hint:"字节飞书——日均100+简历但约面转化率不达标，用漏斗分析定位瓶颈。",
    followups:[{q:"What if the bottleneck wasn't manager review — what else would you have tried?", a:"I'd look at my screening — was I sending the right people? Sometimes the bottleneck is upstream.", cn:"我会看自己的筛选——我推对人了没？有时候瓶颈在上游。"}, {q:"How do you stay calm under that kind of daily pressure?", a:"I break it into tiny wins. Hit today's target → that's enough. Tomorrow is tomorrow.", cn:"我把压力拆成小胜。今天达标就行。明天是明天的事。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At ByteDance's Feishu team I hired for AI developers — 100+ resumes a day, but conversion was stuck at 15%. Pressure was high.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I had to lift conversion without working longer. I was already maxed out.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I mapped the pipeline. Sourcing was fine (90% self-sourced). The bottleneck was manager review — three to four days, and candidates went cold. So I built a one-glance candidate card: tech match, highlight, risk. Review dropped to under a day.</div>
<div class="star-section star-r"><span class="star-label">Result</span>Conversion rose from 15% to about 20% in a month. I wrote a guide that cut ramp-up 40%. Under pressure, work smarter, not harder.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>字节飞书团队我招 AI 开发——日均 100+ 简历，但转化卡在 15%，压力大。</p>
<p><b>任务：</b>我得在不加班的前提下提转化，自己已经满负荷。</p>
<p><b>行动：</b>我梳理了流程。寻访没问题（90% 自主），瓶颈在经理review——要 3-4 天，候选人凉了。于是我做了"一眼卡"：技术匹配、亮点、风险，review 缩到一天内。</p>
<p><b>结果：</b>一个月转化从 15% 升到约 20%；我写了招聘指南，上手效率提 40%。压力下要更聪明地干，不是更久地干。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.3 问题解决与决策", priority:"high", isSTAR:true,
    q:"Give an example of a decision you made with incomplete information.",
    cn:"举例说明你在信息不完整时做出的决策。",
    hint:"人才评估工作台——业务规则没定完就得做架构决策，用可配置设计应对不确定性。",
    followups:[{q:"How do you know when to decide vs. when to wait for more data?", a:"If the cost of being wrong is low and reversible, decide. If it's high and irreversible, wait — but set a hard deadline.", cn:"如果错代价低且可逆，就决定。如果代价高且不可逆，就等——但要设硬截止。"}, {q:"Have you ever made the wrong call with incomplete info?", a:"Yes, once I over-configured for a scenario that never happened. Now I build for the most likely path, not every path.", cn:"有过。一次我为不会发生的场景过度配置了。现在我只为最可能的路径设计，不覆盖全部。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>Building the workbench at Tencent, I had to set the architecture before the business rules were fixed. Six gaps stayed open.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I needed a design that would hold up no matter how the rules landed — without over-building.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I built for the two most likely scenarios, with a configurable rules layer so formulas could change without touching core code. For the gaps I used an adapter. I wrote my assumptions down.</div>
<div class="star-section star-r"><span class="star-label">Result</span>When the rules came back different, we only changed settings — no rebuild. We shipped on time. Can't kill uncertainty? Design for flexibility.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>在腾讯建工作台，业务规则定下前我就得定架构，6 个缺口一直开着。</p>
<p><b>任务：</b>我要一个不管规则怎么变都撑得住、又不超建的设计。</p>
<p><b>行动：</b>我按两种最可能场景建，用可配置规则层——公式变了不用动核心代码；缺口用适配器。我把假设写下来。</p>
<p><b>结果：</b>规则回来不同，我们只改了配置、没重做，按时上线。杀不死不确定时，就为弹性而设计。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.3 问题解决与决策", priority:"medium", isSTAR:true,
    q:"Tell me about a time you used data to solve a problem.",
    cn:"讲述一次你用数据解决问题的经历。",
    hint:"华大基因——提取清洗后台数据，测算人事费用率/新进率/流动率，可视化汇报。",
    followups:[{q:"How do you handle managers who don't trust data?", a:"I start small — show one metric that affects their team directly. Once they see it helps them, they open up.", cn:"我从小处开始——展示一个直接关联他们团队的指标。一旦看到有用，就打开心防了。"}, {q:"What was the messiest data you've had to clean?", a:"At BGI — missing fields, duplicate records, inconsistent formats. Took a full day just to get it usable.", cn:"华大——缺字段、重复记录、格式不一致。光整理到能用就花了一整天。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At BGI Genomics, leaders sized teams and budgets on gut feel. There was no HR reporting, raw data sat unused.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I needed to turn that raw data into metrics leaders could act on.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I cleaned the data and worked out key HR metrics: cost rate, new-hire rate, turnover — benchmarked against the industry. I built a dashboard with the right chart per metric.</div>
<div class="star-section star-r"><span class="star-label">Result</span>The report became a regular tool. Managers asked for their own cuts. In HR, data moves the talk from "I feel turnover is high" to "Department X is 18% vs 12% average."</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>在华大基因，负责人靠感觉定编制和预算，没有 HR 报表，原始数据堆着没人用。</p>
<p><b>任务：</b>我要把原始数据变成负责人能用来看决策的指标。</p>
<p><b>行动：</b>我清洗数据，算出关键 HR 指标：成本率、入职率、流失率——对照行业基准。做了仪表盘，每个指标配对的图。</p>
<p><b>结果：</b>报表成了常规工具，经理开始要自己的切片。HR 里，数据把"我觉得流失高"变成"X 部门 18% 对比均值 12%"。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.4 沟通与影响力", priority:"high", isSTAR:true,
    q:"Describe a time you had to communicate something difficult to a supervisor.",
    cn:"描述一次你向上级传递困难信息的经历。",
    hint:"告诉 MT 人才评估工作台原定时间线不现实——带方案而非道歉去沟通。",
    followups:[{q:"What if your mentor had said no to both options?", a:"Then I'd ask: 'What's your biggest concern?' — and iterate from there. The key is keeping the conversation going, not winning the first round.", cn:"那我就问：'你最担心的是什么？'——然后迭代。关键是保持对话不中断，不是赢第一轮。"}, {q:"How do you prepare for a conversation like that emotionally?", a:"I write out the key points, not a script. Then I remind myself: bad news delivered early is a gift. Delivered late is a betrayal.", cn:"我写出关键点，不是逐字稿。然后提醒自己：坏消息早说是礼物，晚说是背叛。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>Early on the workbench at Tencent, I saw the timeline wasn't realistic. Six data gaps.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I had to tell my mentor the timeline must change, without looking unable to deliver.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I lined up progress against the plan and named three bottlenecks. I brought two options: cut to an MVP, or add two weeks for full scope. I led with data and owned my underestimate.</div>
<div class="star-section star-r"><span class="star-label">Result</span>My mentor appreciated the honesty. We went MVP — ship small, then iterate. Later they said that talk built their trust.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>腾讯工作台早期，我看出时间线不现实。6 个数据缺口。</p>
<p><b>任务：</b>我得告诉导师时间线必须改，又不能显得交付不了。</p>
<p><b>行动：</b>我把进度对照计划、点出三个瓶颈；带两个选项——砍成 MVP，或加两周做全量。我用数据说话，并认了自己低估。</p>
<p><b>结果：</b>导师欣赏坦诚。我们走 MVP——先小上线再迭代。后来导师说那次谈话建立了信任。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.4 沟通与影响力", priority:"medium", isSTAR:true,
    q:"Tell me about a time you explained a complex topic to someone with limited knowledge.",
    cn:"讲述一次你向不熟悉该领域的人解释复杂概念的经历。",
    hint:"向非 HR 的业务方解释绩效校准规则——用类比+一页流程图。",
    followups:[{q:"How do you know your analogy actually landed?", a:"I watch their face and ask: 'Does that make sense, or should I try a different way?' People usually tell you.", cn:"我看表情，然后问：'这样讲通了吗，还是换个方式？'人一般会告诉你。"}, {q:"What if someone keeps saying they get it but clearly doesn't?", a:"Then I switch to examples from their own work. Abstract concepts bounce off — concrete examples stick.", cn:"那我就换他们自己工作中的例子。抽象概念会弹开——具体例子会粘住。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At Tencent I had to explain performance calibration to non-HR stakeholders. It had multi-round review and forced distribution — all jargon to them.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I needed them to understand it well enough to take part.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I swapped jargon for an analogy: calibration is like grading on a curve across classrooms — each line has its own teacher, but we need shared standards so a "B" means the same everywhere. I drew a one-page flow.</div>
<div class="star-section star-r"><span class="star-label">Result</span>Stakeholders joined in, asking sharp questions. One leader said it was the first time the process made sense. A metaphor beats jargon.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>在腾讯我得给非 HR 的干系人讲绩效校准，多轮review、强制分布——对他们全是黑话。</p>
<p><b>任务：</b>我要让他们理解到真能参与进来。</p>
<p><b>行动：</b>我把黑话换成比喻：校准像"跨班拉曲线评分"——各班有自己的老师，但需要统一标准，让"B"在哪都指同一水平。我画了一页流程图。</p>
<p><b>结果：</b>干系人参与了，问出尖锐问题；一位 leader 说这是第一次流程讲得通。比喻胜过黑话。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.5 适应性与韧性", priority:"high", isSTAR:true,
    q:"Tell me about a time you had to adapt quickly to significant change.",
    cn:"讲述一次你快速适应重大变化的经历。",
    hint:"从阿勒泰支教到字节飞书实习——从乡村教育到互联网高节奏的剧变。",
    followups:[{q:"What was the hardest habit to unlearn from Altay?", a:"The pace. In Altay things move slowly — you wait for seasons. At ByteDance, you wait for nothing.", cn:"节奏。阿勒泰的节奏慢——你等季节。字节不等任何东西。"}, {q:"Did you ever feel like quitting in the first month?", a:"Not quit, but I definitely wondered if I was in over my head. That feeling is normal — it means you're growing.", cn:"没想过辞职，但确实怀疑自己是不是跟不上了。那种感觉正常——说明在成长。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>After a year in Altay — 26 people, 527 students — I joined ByteDance's Feishu team in Beijing.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I had to adapt to a new culture, learn recruiting tools, and prove myself in a three-month internship.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I treated it like learning a language. First week I shadowed every recruiter and took notes. My rule: ask once, write it down, never twice.</div>
<div class="star-section star-r"><span class="star-label">Result</span>In three weeks I ran my own pipelines — 100+ resumes a day at 90% self-sourced. A "gap" became my biggest edge.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>阿勒泰支教一年（26 人团队、527 名学生）后，我进字节飞书北京团队。</p>
<p><b>任务：</b>我得适应新文化、学会招聘工具，并在三个月实习里证明自己。</p>
<p><b>行动：</b>我把它当学一门语言。第一周跟每位招聘影子学习、做笔记。我的规矩：问一次、写下来、绝不问第二遍。</p>
<p><b>结果：</b>三周后我独立跑流程——日均 100+ 简历、90% 自主寻访。简历上的"空档"成了我最大的优势。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.5 适应性与韧性", priority:"high", isSTAR:true,
    q:"Describe a time you had to deal with ambiguity.",
    cn:"描述一次你应对模糊性的经历。",
    hint:"MT 给了'探索 AI token 管理'这个开放问题——没有框架、没有先例。",
    followups:[{q:"How do you know when you've gathered enough data to move forward?", a:"When I can explain the problem in one sentence and the direction in two. If I can't, I'm not ready.", cn:"当我能用一句话讲清问题、两句话讲清方向的时候。如果做不到，说明还没准备好。"}, {q:"What was the most surprising thing you learned from the token data?", a:"That a few people were using 80% of the budget — and they didn't even realize it. Visibility alone changed behavior.", cn:"少数几个人用了80%的预算——而且他们自己都没意识到。光是让数据可见就改变了行为。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At Tencent my mentor asked me to "explore AI token management" — wide open. No template, no precedent.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I had to build structure from nothing: name the problem, propose a direction, produce something useful.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I broke it into chunks. First I listed what I didn't know: spend, users, use cases. Then I chased each with data. With it I reframed: "We spend X a month; Y% is ad-hoc use we could standardize."</div>
<div class="star-section star-r"><span class="star-label">Result</span>The framework was adopted, and I turned it into a daily token-saving manual. My method: list unknowns, gather data, reframe, propose.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>在腾讯导师让我"探索 AI token 管理"——完全开放，没模板、没先例。</p>
<p><b>任务：</b>我得从零建结构：定义问题、提方向、产出有用的东西。</p>
<p><b>行动：</b>我把模糊拆成块。先列不知道的：花费、用户、场景；再逐个用数据追。据此重新定义："我们月花 X，其中 Y% 是能标准化的临时用法。"</p>
<p><b>结果：</b>框架被采纳，我还写成了每日省 token 手册。我的方法：列未知、集数据、重定义、提方案。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.6 失败与成长 (STARR)", priority:"high", isSTAR:true,
    q:"Tell me about a time you failed. What did you learn?",
    cn:"讲述一次失败的经历，你学到了什么？",
    hint:"STARR结构——字节招聘中对候选人技术匹配度判断失误。",
    followups:[{q:"How do you handle failure in the moment — right after it happens?", a:"I give myself a few hours to be annoyed, then I write down what happened and what I'd do differently. The writing forces me to process it.", cn:"我给自己几个小时不爽，然后写下发生了什么、下次会怎么做。写的过程逼我消化。"}, {q:"Do you think this failure still affects how you screen candidates?", a:"Absolutely. I still run my three-question protocol for every AI dev role. That failure turned into my sharpest tool.", cn:"当然。我现在每个AI开发岗还跑三问协议。那次失败变成了我最锋利的工具。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STARR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At ByteDance's Feishu team I recruited for a large-model role and fast-tracked a candidate with an impressive AI resume.</div>
<div class="star-section star-t"><span class="star-label">Task</span>My job was to spot qualified people fast.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I let the resume override a real check. The candidate gave vague answers, so I skipped examples and pushed them through.</div>
<div class="star-section star-r"><span class="star-label">Result</span>They bombed the technical interview — couldn't answer basic questions about their resume. The manager was annoyed.</div>
<div class="star-section star-refl"><span class="star-label">Reflection</span>I built a rule: any AI role gets at least three "tell me a specific time you..." questions, and wrote the Guide — zero failures after.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>字节飞书团队招大模型岗，我把一位简历惊艳的候选人快速推了上去。</p>
<p><b>任务：</b>我的活是快速识别靠谱的人。</p>
<p><b>行动：</b>我让简历盖过了真实核查。候选人对模型工作答得很虚，我就跳过了要例子，直接推了。</p>
<p><b>结果：</b>技术面崩了——连自己简历上的基础问题都答不出，经理很恼火。</p>
<p><b>反思：</b>我立了规矩：任何 AI 岗至少问三个"具体举一次你…"的问题，并写了指南——之后再没翻车。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.6 失败与成长 (STARR)", priority:"high", isSTAR:true,
    q:"Describe a time you received feedback that was hard to hear. How did you respond?",
    cn:"描述一次你收到刺耳反馈的经历，你是怎么回应的？",
    hint:"MT 说绩效框架初稿太理论化——不够贴业务。用 STARR。",
    followups:[{q:"How do you ask for feedback when nobody's offering it?", a:"I make it specific: 'What's one thing I could do better this week?' Specific questions get real answers.", cn:"我问得具体：'这周我有一件事能做得更好，是什么？'具体问题能得到真实回答。"}, {q:"What feedback do you get most often?", a:"That I over-prepare — which is both a strength and a weakness. I'm learning to prep enough, not perfectly.", cn:"���我准备过度——既是优点也是缺点。我在学'准备够'而不是'准备完美'。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STARR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At Tencent I built a performance framework. My mentor said: "Well-designed, but no leader will use it — too complex."</div>
<div class="star-section star-t"><span class="star-label">Task</span>My instinct was to defend it — but I knew leaders would feel it more.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I asked what a leader would find confusing, then listened. Two leaders I interviewed thought in "did they deliver?" and "are they growing?" — not scorecards. So I rebuilt it in their words, cutting seven to three dimensions.</div>
<div class="star-section star-r"><span class="star-label">Result</span>The revised framework was adopted.</div>
<div class="star-section star-refl"><span class="star-label">Reflection</span>That feedback stung, but it was my best moment. In HR, "well-designed" means usable, not perfect on paper.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>在腾讯我做了个绩效框架。导师说："设计得不错，但没 leader 会用——太复杂。"</p>
<p><b>任务：</b>我本能想辩护——但我知道 leader 的体感更关键。</p>
<p><b>行动：</b>我问"leader 会觉得哪混乱"，然后去听。访谈的两位 leader 想的是"交付了吗""在成长吗"，不是计分卡。于是我用他们的语言重建，从 7 个维度砍到 3 个。</p>
<p><b>结果：</b>改后的框架被采纳。</p>
<p><b>反思：</b>那反馈扎心，却是我最好的时刻。HR 里"设计得好"=能用，不是纸上完美。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.7 变革管理", priority:"high", isSTAR:true,
    q:"Tell me about a change you brought about in your role.",
    cn:"讲述一次你在岗位上推动的变革。",
    hint:"AI token 管理——从无序使用到三级配额体系+操作手册。",
    followups:[{q:"How did you get people to actually follow the new token rules?", a:"I made following the rules easier than breaking them. The ops manual had templates and shortcuts — the path of least resistance.", cn:"我让遵守规则比打破规则更容易。操作手册有模板和捷径——走阻力最小的路。"}, {q:"Did anyone push back on the governance framework?", a:"A few people worried about restrictions. I showed them the data: usage actually went up after governance, not down.", cn:"有人担心限制太多。我给他们看数据：治理后使用量反而上去了，不是下去了。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At Tencent there was no AI token governance. People used tools freely, costs unpredictable, leadership might lock it down.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I needed governance that controlled cost without killing useful AI use.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I designed a three-tier model: a baseline budget for all, a project pool (lead-approved), and on-demand for special needs. I wrote an ops manual. I framed it as "make AI sustainable," not "restrict access."</div>
<div class="star-section star-r"><span class="star-label">Result</span>Costs became predictable and stayed in budget while AI use went up. The model and manual were shared with other teams.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>腾讯没有 AI token 治理，大家随便用、成本不可控，管理层可能一刀切关停。</p>
<p><b>任务：</b>我要的治理是控成本但不掐死有用的 AI 使用。</p>
<p><b>行动：</b>我设计了三层模型：全员基础额度、项目池（leader 批）、特殊需求按需。写了运营手册。定位成"让 AI 可持续"，不是"限制使用"。</p>
<p><b>结果：</b>成本可预测且在预算内，AI 用量反而上升；模型和手册被其他团队复用。</p></div>`
  },
  {
    module:2, moduleLabel:"行为面试 STAR", subGroup:"2.8 数据驱动与伦理", priority:"medium", isSTAR:true,
    q:"Describe a time you faced an ethical dilemma at work.",
    cn:"描述一次你在工作中面临的伦理困境。",
    hint:"发现招聘渠道偏向名校——系统性排除了有能力但非名校的候选人。",
    followups:[{q:"What if your lead had said no to the pilot?", a:"I'd respect the decision but keep the data. When the next hiring cycle came, I'd come back with updated numbers.", cn:"我尊重决定但留着数据。下一轮招聘周期时带着更新的数据再来。"}, {q:"How do you decide when an ethical issue is worth raising vs. letting go?", a:"If it systematically hurts a group of people, I raise it. If it's a one-off preference issue, I let it go.", cn:"如果是系统性地伤害某个群体，我提。如果是一次性偏好问题，我放。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>Recruiting at ByteDance, I noticed our sourcing leaned hard on target schools — efficient, but it shut out capable candidates elsewhere.</div>
<div class="star-section star-t"><span class="star-label">Task</span>The approach looked fine by metrics, but felt off. I raised it with data.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I pulled non-target-school hires and compared performance — no real difference. I took that to my lead and suggested piloting three more schools.</div>
<div class="star-section star-r"><span class="star-label">Result</span>The lead agreed to a pilot. Those who got through performed just as well. Ethical knots untie best with data and small tests.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>字节招聘时，我注意到寻访严重依赖目标院校——效率高，却把其他学校的有能力候选人挡在门外。</p>
<p><b>任务：</b>按指标看没问题，但感觉不对。我用数据提出来。</p>
<p><b>行动：</b>我拉了非目标院校入职者的表现对比——没真差异。拿给 leader，建议试点多 3 所学校。</p>
<p><b>结果：</b>leader 同意试点，进来的人表现一样好。伦理死结最好用数据和小测试解开。</p></div>`
  },

  // ===== M3: HR-Specific =====
  {
    module:3, moduleLabel:"HR 专业场景", subGroup:"3.1 招聘与人才获取", priority:"high", isSTAR:true,
    q:"Describe a complex recruitment challenge you faced and how you overcame it.",
    cn:"描述你遇到的一个复杂招聘挑战，以及如何克服的。",
    hint:"字节飞书——大模型开发岗，技术门槛高+候选人稀缺+需理解AI技术场景。",
    followups:[{q:"How do you stay current on AI tech when it moves so fast?", a:"I follow a few key people on X and read release notes — not everything, just the stuff that affects hiring.", cn:"我在X上关注几个关键人物、读发布说明——不是全追，只关注影响招聘的那部分。"}, {q:"What's the hardest AI role to recruit for right now?", a:"Large-model infra engineers. Small pool, every company wants them, and comp expectations are wild.", cn:"大模型基础设施工程师。池子小、每家公司都在抢、薪酬预期很夸张。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At ByteDance's Feishu team I hired for large-model roles — a cut-throat market where several firms chased the same people.</div>
<div class="star-section star-t"><span class="star-label">Task</span>I needed quality hires while keeping my 90% self-source rate and lifting conversion off 15%.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I became a domain expert and mapped which tech stacks fit which sub-roles. I built candidate cards flagging tech match, highlights, risk, and wrote the Guide.</div>
<div class="star-section star-r"><span class="star-label">Result</span>The guide cut ramp-up 40%; conversion went 15% to 20%. The team adopted my cards. As an HRBP, recruiting is my fastest way to learn a business.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>字节飞书招大模型岗——多家公司抢同一批人的刺刀市场。</p>
<p><b>任务：</b>我要在保持 90% 自主寻访率、把转化从 15% 提上来的同时，还要招到质量。</p>
<p><b>行动：</b>我成了领域专家，把技术栈对应到子角色；做了候选人卡，标技术匹配、亮点、风险，并写了指南。</p>
<p><b>结果：</b>指南让上手效率提 40%，转化 15%→20%，团队用了我的卡。作为 HRBP，招聘是我最快懂业务的方式。</p></div>`
  },
  {
    module:3, moduleLabel:"HR 专业场景", subGroup:"3.2 绩效与员工关系", priority:"high", isSTAR:true,
    q:"Tell me about a time you had to deal with a difficult employee situation or conflict.",
    cn:"讲述一次你处理困难员工关系或冲突的经历。",
    hint:"华大基因 HRBP——处理部门负责人和员工之间的公开批评螺旋。",
    followups:[{q:"What if the manager refused to change their approach?", a:"Then it becomes a performance conversation about the manager — not the employee. HRBP has to go there sometimes.", cn:"那就变成关于 manager 自己的绩效谈话——不关员工的事了。HRBP 有时候就得走到这一步。"}, {q:"How do you stay neutral when one side is clearly wrong?", a:"I don't stay neutral — I stay fair. Fair means naming the problem accurately, not pretending both sides are equal.", cn:"我不保持中立——我保持公平。公平意味着准确指出问题，不是假装两边对等。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案 · STAR</span></div>
    <div class="answer-body"><div class="star-section star-s"><span class="star-label">Situation</span>At BGI Genomics a manager gave an employee negative feedback in public. The employee checked out and missed deadlines.</div>
<div class="star-section star-t"><span class="star-label">Task</span>As HRBP I had to step in — support the employee and coach the manager — without taking sides.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I met the employee first, in private. Then I told the manager his public criticism demotivates, and set one rule: feedback is private, praise public.</div>
<div class="star-section star-r"><span class="star-label">Result</span>Within a month the dynamic turned. Performance recovered; the manager used private channels. In employee relations you help both see the other's view.</div></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p><b>情境：</b>华大基因一位经理当众给员工负面反馈。员工消极、错过deadline。</p>
<p><b>任务：</b>作为 HRBP 我得介入——既支持员工也辅导经理——不站队。</p>
<p><b>行动：</b>我先私下见员工。再见经理："你觉得你的反馈落点怎么样？"他没想到当众批评会打击人。我立一条规矩：纠正性反馈私下，表扬可以公开。</p>
<p><b>结果：</b>一个月内关系转好，绩效回升，经理改用私下渠道。员工关系里你帮双方看到对方视角。</p></div>`
  },
  {
    module:3, moduleLabel:"HR 专业场景", subGroup:"3.3 人力规划与组织发展", priority:"medium",

    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>As an HRBP, retention is a key talk with a business leader. Four steps.</p>

<p>Two — acknowledge, don't commit: "I get why that's frustrating" shows I hear them, no promises yet.</p>

<p>Four — follow up fast, within 48 hours. I'd never hold someone with guilt or empty promises.</p></div>

      <p>作为 HRBP，留任是我和业务 leader 的关键对话。四步。</p>

<p>三、探索什么能改主意："如果解决核心问题，你想留下吗？"诚实说明我权限内什么能做。</p>

    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>As an HRBP, layoffs are the hardest call — but sometimes the most responsible. Four principles.</p>
<p>One — before cutting, seek alternatives: freezes, attrition, consolidation.</p>
<p>Two — if cuts are needed, use clear criteria: performance, redundancy, skill fit, same across teams, documented.</p>
<p>Three — lead with dignity: face-to-face talks, severance ready first, honest about the reason.</p>
<p>Four — care for survivors: name the difficulty, address fear of more cuts. If a role can't tie to real outcomes, keeping it is worse than cutting.</p></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>作为 HRBP，裁员最难——但有时最负责。四原则。</p>
<p>一、裁前先找替代：冻结、自然流失、合并。</p>
<p>二、必须裁时用清晰标准：绩效、冗余、技能匹配，跨团队一致、留档。</p>
<p>三、优先尊严：面对面谈、离职补偿先备好、诚实说原因。</p>
<p>四、关怀留下的人：承认困难、回应继续裁的担忧。挂不到真实结果的岗位，留着比裁掉更糟。</p></div>`

      <p>因为我想坐在业务旁边，而不是只待在一条车道里。招聘和薪酬都关键，但它们是一块块切片。做 HRBP，我看的是整个团队——招聘、成长、摩擦、离开——帮 leader 在所有这些上做决定。</p>
<p>我的实习覆盖了 HRBP、招聘和人才。HRBP 这个位置让我觉得最有用：把"我们有个问题"变成"这是人的动作"。</p></div>`

    followups:[

<p>Second, I'd learn the numbers that matter to them: acquisition cost, fill rate, churn. HR earns a seat by speaking the business's language. I'd also map the team: who does what, where the friction is.</p></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>

<p>其次，学对他们重要的数字：获客成本、履约率、流失。HR 要靠说业务的语言才能有座位。我也会把团队画出来：谁做什么、摩擦在哪。</p></div>`

    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>I watch a few that link to business health. Attrition — especially regretted attrition — tells me if we're keeping who we need. Time-to-hire and offer-accept rate tell me if we can staff a launch in time.</p>
<p>I also watch eNPS and internal mobility. A team that can't move people internally will lose them externally. Numbers only matter if they change a decision — so I report what the leader can act on.</p></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>

<p>我也看 eNPS 和内部流动。一个内部调不动人的团队，最终会对外失去人。数字只有在能改变决定时才有意义——所以我只报 leader 能动手的那部分。</p></div>`

  {

    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>

<div class="star-section star-t"><span class="star-label">Task</span>I had to lead a 26-person volunteer team and teach 527 students I couldn't fully reach at first.</div>
<div class="star-section star-a"><span class="star-label">Action</span>I learned the local pace instead of pushing mine. I listened before fixing, and showed up consistently for the kids and the team.</div>

<p>结果：信任慢慢但稳稳地建立。团队运转顺了，我也学到怎么在一个不是我的文化里赢得位置——这正是国际 HRBP 的核心。</p></div>`

    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>First, I talk to each side separately — the employee and the manager. I listen before judging. I want the real story, not the version that wins.</p>
<p>Then I check the pattern. Is this one clash, or a manager who loses good people? If it's style, I coach the manager and help them repair. If it's a real gap, I look at a move for the employee. My job is to keep the person and the fairness — not to pick a side.</p></div>

  },,
  {
    module:9, moduleLabel:"字节国际电商HRBP", subGroup:"情景案例", priority:"high",

    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>I start by aligning on the number and the profile — who exactly we need, not just 'sales.' Then I build the pipeline from local channels and referrals, not only job boards.</p>
<p>I speed the process without dropping the bar: clear scorecards, fast feedback, and a local interviewer who gets the market. I also plan onboarding now, not after — because hiring fast and losing fast is just expensive churn. The plan serves the launch date.</p></div>

<p>我加速流程但不降 bar：清楚的分数卡、快速反馈、一个懂市场的本地面试官。我也现在就规划 onboarding，而不是事后——因为招得快、走得快只是贵的流失。计划服务 launch 日期。</p></div>`
  },,
  {
    module:9, moduleLabel:"字节国际电商HRBP", subGroup:"文化价值观", priority:"high",
    q:"Which of ByteDance's values resonates most with you?",
    cn:"字节的价值观里，哪一条最打动你？",

    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>"Seek truth from facts" sticks with me. In HR it's easy to manage by impression — who seems busy, who seems difficult. I'd rather look at the data and the real story.</p>

    followups:[
      {q:"Any limit on travel?", a:"None I can't rearrange. I planned my life to stay mobile.", cn:"没有我调不开的。我把生活安排得能移动。"},

    <div class="answer-body"><p>Yes to both. I can work in English day to day — I've prepared for it, and I keep practicing. For an international role, that's the floor, not the ceiling.</p>

<p>我接受出差，也接受去业务需要我的地方。HRBP 就是要出现在团队在的地方，而不是在总部等。哪个市场需要搭建，我更想在房间里，而不是在电话里。</p></div>`

// ====== APP LOGIC ======
let currentModule='all', currentIdx=0, isShuffled=false, shuffleOrder=[], isFlipped=false;
function getFilteredQuestions(){ if(currentModule==='all') return QUESTIONS; return QUESTIONS.filter(q=>q.module===parseInt(currentModule)); }
function getDisplayList(){ if(isShuffled) return shuffleOrder.map(i=>QUESTIONS[i]); return getFilteredQuestions(); }
function buildShuffleOrder(){ const f=getFilteredQuestions(); const idx=f.map(q=>QUESTIONS.indexOf(q)); for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];} shuffleOrder=idx; }
function renderFollowups(fus){
  if(!fus || !fus.length) return '';
  let h='<div class="followup-section"><div class="followup-header">可能的追问 · 预设回复</div>';
  for(const f of fus){ h+='<div class="followup-item"><button class="speak-btn" data-speak="'+escAttr(f.a)+'">🔊</button><div class="followup-q">'+f.q+'</div><div class="followup-a">'+f.a+'</div>'+(f.cn?'<div class="followup-cn">'+f.cn+'</div>':'')+'</div>'; }
  h+='</div>';
  return h;
}

// ---- Text-to-Speech (英文朗读参考) ----
let currentUtter=null;
function speak(text, btn){
  if(!('speechSynthesis' in window)){ alert('你的浏览器不支持朗读功能，建议用 Chrome 或 Safari 打开。'); return; }
  if(currentUtter){ window.speechSynthesis.cancel(); }
  if(btn && btn.classList.contains('speaking')){ btn.classList.remove('speaking'); return; }
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.92; u.pitch=1;
  const voice=window.speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang)&&/female|samantha|zira|google/i.test(v.name))
            || window.speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
  if(voice) u.voice=voice;
  document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'));
  if(btn) btn.classList.add('speaking');
  u.onend=()=>{ if(btn) btn.classList.remove('speaking'); };
  u.onerror=()=>{ if(btn) btn.classList.remove('speaking'); };
  currentUtter=u;
  window.speechSynthesis.speak(u);
}
function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 预热语音引擎（部分浏览器首次 getVoices 为空，需等 voiceschanged）
if('speechSynthesis' in window){ window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices(); }

function renderCard(){
  const list=getDisplayList();
  if(list.length===0){document.getElementById('cardFront').innerHTML='<p style="text-align:center;color:#999;padding:40px;">暂无题目</p>';document.getElementById('cardBack').innerHTML='';return;}
  if(currentIdx>=list.length) currentIdx=list.length-1;
  if(currentIdx<0) currentIdx=0;
  const q=list[currentIdx]; isFlipped=false;
  document.getElementById('card').classList.remove('flipped');
  let badges=`<span class="badge badge-module">${q.moduleLabel}</span>`;
  if(q.isSTAR) badges+=`<span class="badge badge-star">STAR</span>`;
  if(q.priority==='high') badges+=`<span class="badge badge-priority">高频</span>`;
  if(q.isAI) badges+=`<span class="badge badge-ai">AI×HR</span>`;
  document.getElementById('cardFront').innerHTML=`<div class="card-meta">${badges}</div><div class="question-en">${q.q}</div><div class="question-cn">${q.cn}</div><div class="story-hint"><span class="label">素材提示</span>${q.hint}</div><div class="flip-hint">点击卡片查看参考答案 ↓</div>`;
  document.getElementById('cardBack').innerHTML=q.answer + renderFollowups(q.followups);
  // 在答案 header 加「朗读答案」按钮
  const header=document.querySelector('#cardBack .answer-header');
  if(header){
    const sp=document.createElement('button');
    sp.className='speak-btn';
    sp.textContent='🔊 朗读答案';
    sp.setAttribute('data-full','1');
    header.appendChild(sp);
  }
  document.getElementById('progressText').textContent=`${currentIdx+1} / ${list.length}`;
  document.getElementById('progressFill').style.width=`${((currentIdx+1)/list.length)*100}%`;
  document.getElementById('prevBtn').disabled=currentIdx===0;
  document.getElementById('nextBtn').disabled=currentIdx===list.length-1;
}
function flipCard(){ isFlipped=!isFlipped; document.getElementById('card').classList.toggle('flipped'); }
function nextCard(){ const list=getDisplayList(); if(currentIdx<list.length-1){currentIdx++;renderCard();} }
function prevCard(){ if(currentIdx>0){currentIdx--;renderCard();} }
function setModule(mod){ currentModule=mod; currentIdx=0; if(isShuffled) buildShuffleOrder(); document.querySelectorAll('.module-nav li').forEach(li=>li.classList.toggle('active',li.dataset.module===mod)); renderCard(); }
function toggleShuffle(){ isShuffled=!isShuffled; document.getElementById('shuffleBtn').classList.toggle('active'); currentIdx=0; if(isShuffled) buildShuffleOrder(); renderCard(); }
function updateCounts(){ document.getElementById('countAll').textContent=QUESTIONS.length; for(let m=1;m<=9;m++){const c=QUESTIONS.filter(q=>q.module===m).length;const el=document.getElementById('count'+m);if(el)el.textContent=c;} }
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prevCard();else if(e.key==='ArrowRight')nextCard();else if(e.key===' '){e.preventDefault();flipCard();}});
// 朗读按钮：事件委托（答案区每次重渲染，统一在容器上监听）
document.getElementById('cardBack').addEventListener('click',e=>{
  const btn=e.target.closest('.speak-btn');
  if(!btn) return;
  e.stopPropagation();   // 阻止冒泡到卡片，避免点击朗读按钮时翻页
  if(btn.hasAttribute('data-full')){
    const body=document.querySelector('#cardBack .answer-body');
    speak(body?body.innerText:'', btn);
  } else if(btn.dataset.speak){
    speak(btn.dataset.speak, btn);
  }
});
document.querySelectorAll('.module-nav li').forEach(li=>li.addEventListener('click',()=>setModule(li.dataset.module)));
updateCounts(); renderCard();
</script>
