    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>Three principles: fairness, transparency, dignity.</p>
<p><b>1. Before cutting: look for alternatives:</b> A 15% cut should be the last resort. Can we save through hiring freezes, natural attrition, fewer contractors, role consolidation, or voluntary exits? In the subsidiary talent transformation work I'm doing, I've seen the question isn't always "who do we cut?" but "how do we reshape roles so we need fewer?" If AI can augment some roles, we might shrink through attrition instead of layoffs.</p>
<p><b>2. If cuts are needed: clear, consistent criteria:</b> Objective and defensible — performance records, role redundancy, skill fit. Applied the same way across teams, with the decision process documented. The worst thing in a layoff is looking arbitrary.</p>
<p><b>3. During: lead with dignity:</b> Conversations are face to face, not by email. Managers come with talking points. Severance, outplacement, references ready before the talk. Be honest about the business reason.</p>
<p><b>4. After: care for the survivors:</b> Team meetings to name the difficulty, explain the context, and address fears of more cuts. Survivor guilt is real — ignore it and you'll see disengagement and more leaving.</p>
<p>My philosophy, shaped by this work: if a role can't tie to real business outcomes, keeping it is worse than cutting it — for the person and the company alike.</p></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>三个原则：公平、透明、尊严。</p>
      <p><b>1. 裁之前：探索替代方案。</b>15%裁减应是最后手段。能否通过冻结招聘、自然流失、减少外包、岗位合并、自愿离职来实现？在子公司人才转型工作中，我发现有时问题不是"裁谁"——而是"怎么转型岗位让人更少？"如果 AI 能增强某些角色，也许通过自然流失而非裁员。</p>
      <p><b>2. 必须裁时：清晰一致的标准。</b>客观可辩护——绩效记录、岗位冗余、技能相关性。跨团队一致执行，决策过程留档。裁员最糟的是被认为随意。</p>
      <p><b>3. 执行中：优先尊严。</b>面对面谈，不发邮件。manager 有谈话要点。离职补偿、再就业支持、推荐信在谈话前就准备好。诚实说明业务原因。</p>
      <p><b>4. 之后：关怀留下的人。</b>开会承认困难、解释背景、回应进一步裁减的担忧。幸存者内疚是真实的——忽视它会导致倦怠和更多流失。</p>
      <p>我的理念，受当前工作影响：如果一个岗位挂不到真实业务绩效上，留着比裁掉更糟——对个人和组织都是。</p>
    </div>

    followups:[{q:"What if leadership doesn't want to hear about bias?", a:"I frame it as a business risk — 'we might be losing talent we can't afford to lose.' That gets attention.", cn:"我把它框成业务风险——'我们可能在流失我们丢不起的人才。'这能引起注意。"}, {q:"How do you measure whether the fix actually worked?", a:"Track the same metrics across 2-3 cycles after the intervention. If the pattern doesn't shift, the fix was wrong — try again.", cn:"干预后跟踪2-3个周期同样的指标。如果模式不变，说明方案不对——再来。"}],
    answer:`<div class="answer-header"><span class="answer-title">参考答案</span></div>
    <div class="answer-body"><p>Data first, system-level:</p>
<p><b>1. Verify with data:</b> Pull promotion data across 2+ cycles and look at it by demographic. Find statistically real patterns, not one-off cases.</p>
<p><b>2. Find the root cause:</b> Trace the pipeline: nomination → sponsorship → evaluation → calibration. Where does bias slip in? Different roots need different fixes.</p>
<p><b>3. Targeted fixes:</b> Nomination problem → widen the criteria. Calibration problem → blind evaluation or a diverse panel. Evaluation problem → standard rubrics plus cross-line review (which I've done at Tencent).</p>
<p><b>4. Track and iterate:</b> Watch it by demographic in later cycles. Report progress to leadership. Bias isn't a one-time fix — it's ongoing monitoring.</p>
<p>Politically: I'd frame it as "I noticed a pattern, let's improve the process" — not "you're biased." People respond to "let's improve" far better than to an accusation.</p></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>数据先行、系统层面：</p>
      <p><b>1. 用数据验证。</b>拉2+周期晋升数据，按人口统计维度分析。找统计显著模式，不是个案。</p>
      <p><b>2. 理解根因。</b>追溯管线：提名→赞助→评估→校准。偏见从哪进入？不同根因需要不同解法。</p>
      <p><b>3. 提出针对性干预。</b>提名问题→拓宽标准。校准问题→盲评或多元评审。评估问题→标准化评分+跨条线复核（我在腾讯实施过）。</p>
      <p><b>4. 追踪迭代。</b>后续周期按维度监控。向管理层汇报进展。偏见不是一次性修复——是持续监控。</p>
      <p>政治上：定位为"我发现了一个模式，让我们改进"——不是"你有偏见"。人对"让我们改进"比对指控反应好得多。</p>
    </div>
    <div class="source-tag">信息源：简历：腾讯跨条线校准 · Resumly 2026 DEI</div>

    answer:`<div class="answer-header"><span class="answer-title">参考答案 · 准备 3-5 个反问</span></div>
    <div class="answer-body"><p>Yes, a few:</p>
<p><b>1. What does success look like in this role in the first 6 months?</b> — Shows I'm thinking about delivery, not just landing the job.</p>
<p><b>2. What's the biggest HR challenge the company is facing right now?</b> — Shows strategic thinking; their answer tells me what I'd walk into.</p>
<p><b>3. How does the company approach AI in HR?</b> — My differentiator. Signals AI × HR expertise and opens the door to my token governance and platform work.</p>
<p><b>4. How is the HR team structured, and how does it partner with the business?</b> — Shows I care how HR actually runs.</p>
<p><b>5. What opportunities are there for professional development?</b> — Standard but matters.</p>
<p>I'd pick 2-3 based on how the interview's going. The goal: ask things that show I've been listening and thinking, not reading from a list.</p></div>
    <div class="cn-translation"><span class="cn-label">中文对照</span>
      <p>是的，几个问题：</p>
      <p><b>1. 这个岗位前6个月的成功标准是什么？</b>——表明我在想交付，不只是拿到 offer。</p>
      <p><b>2. 公司目前最大的 HR 挑战是什么？</b>——展示战略思考。答案告诉我即将面对什么。</p>
      <p><b>3. 公司如何推进 AI 在 HR 中的应用？</b>——我的差异化问题。信号 AI×HR 专长，打开讨论 token 治理和平台建设经验的大门。</p>

// ====== APP LOGIC ======
let currentModule='all', currentIdx=0, isShuffled=false, shuffleOrder=[], isFlipped=false;
function getFilteredQuestions(){ if(currentModule==='all') return QUESTIONS; return QUESTIONS.filter(q=>q.module===parseInt(currentModule)); }
function getDisplayList(){ if(isShuffled) return shuffleOrder.map(i=>QUESTIONS[i]); return getFilteredQuestions(); }
function buildShuffleOrder(){ const f=getFilteredQuestions(); const idx=f.map(q=>QUESTIONS.indexOf(q)); for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];} shuffleOrder=idx; }
function renderFollowups(fus){
  if(!fus || !fus.length) return '';
  let h='<div class="followup-section"><div class="followup-header">可能的追问 · 预设回复</div>';
  for(const f of fus){ h+='<div class="followup-item"><div class="followup-q">'+f.q+'</div><div class="followup-a">'+f.a+'</div>'+(f.cn?'<div class="followup-cn">'+f.cn+'</div>':'')+'</div>'; }
  h+='</div>';
  return h;
}

function renderCard(){
  const list=getDisplayList();
  if(list.length===0){document.getElementById('cardFront').innerHTML='<p style="text-align:center;color:#999;padding:40px;">暂无题目</p>';document.getElementById('cardBack').innerHTML='';return;}
  if(currentIdx>=list.length) currentIdx=list.length-1;
  if(currentIdx<0) currentIdx=0;
  const q=list[currentIdx]; isFlipped=false;
  document.getElementById('card').classList.remove('flipped');
  let badges=`<span class="badge badge-module">${q.moduleLabel}</span>`;
  if(q.isSTAR) badges+=`<span class="badge badge-star">STAR</span>`;
  if(q.priority==='high') badges+=`<span class="badge badge-priority">高频</span>`;
  if(q.isAI) badges+=`<span class="badge badge-ai">AI×HR</span>`;
  document.getElementById('cardFront').innerHTML=`<div class="card-meta">${badges}</div><div class="question-en">${q.q}</div><div class="question-cn">${q.cn}</div><div class="story-hint"><span class="label">素材提示</span>${q.hint}</div><div class="flip-hint">点击卡片查看参考答案 ↓</div>`;
  document.getElementById('cardBack').innerHTML=q.answer + renderFollowups(q.followups);
  document.getElementById('progressText').textContent=`${currentIdx+1} / ${list.length}`;
  document.getElementById('progressFill').style.width=`${((currentIdx+1)/list.length)*100}%`;
  document.getElementById('prevBtn').disabled=currentIdx===0;
  document.getElementById('nextBtn').disabled=currentIdx===list.length-1;
}
function flipCard(){ isFlipped=!isFlipped; document.getElementById('card').classList.toggle('flipped'); }
function nextCard(){ const list=getDisplayList(); if(currentIdx<list.length-1){currentIdx++;renderCard();} }
function prevCard(){ if(currentIdx>0){currentIdx--;renderCard();} }
function setModule(mod){ currentModule=mod; currentIdx=0; if(isShuffled) buildShuffleOrder(); document.querySelectorAll('.module-nav li').forEach(li=>li.classList.toggle('active',li.dataset.module===mod)); renderCard(); }
function toggleShuffle(){ isShuffled=!isShuffled; document.getElementById('shuffleBtn').classList.toggle('active'); currentIdx=0; if(isShuffled) buildShuffleOrder(); renderCard(); }
function updateCounts(){ document.getElementById('countAll').textContent=QUESTIONS.length; for(let m=1;m<=8;m++){const c=QUESTIONS.filter(q=>q.module===m).length;const el=document.getElementById('count'+m);if(el)el.textContent=c;} }
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prevCard();else if(e.key==='ArrowRight')nextCard();else if(e.key===' '){e.preventDefault();flipCard();}});
document.querySelectorAll('.module-nav li').forEach(li=>li.addEventListener('click',()=>setModule(li.dataset.module)));
updateCounts(); renderCard();
</script>
